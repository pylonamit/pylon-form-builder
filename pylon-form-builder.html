tree.addEventListener('dblclick', e => { const node = e.target.closest('.node'); if(!node) return; select({kind:node.dataset.kind, id:node.dataset.id}, {focus: node.dataset.kind==='field'?'label':'title'}); });
tree.addEventListener('contextmenu', e => { const node = e.target.closest('.node'); if(!node) return; e.preventDefault(); openMenu(e, {kind:node.dataset.kind, id:node.dataset.id}, node.querySelector('.row .more')); });
tree.addEventListener('keydown', e => {
  const row = e.target.closest('.row'); if(!row) return; const node = row.parentElement; const ref = {kind:node.dataset.kind, id:node.dataset.id};
  const rows = $$('.row', tree).filter(r => r.offsetParent); const i = rows.indexOf(row); const mod = e.metaKey||e.ctrlKey;
  const k = e.key;
  if(k==='ArrowDown' && !e.altKey){ e.preventDefault(); rows[i+1]?.focus(); }
  else if(k==='ArrowUp' && !e.altKey){ e.preventDefault(); rows[i-1]?.focus(); }
  else if(k==='Enter'){ e.preventDefault(); select(ref, {noScroll:true, focus: ref.kind==='field'?'label':'title'}); }
  else if(k===' '){ e.preventDefault(); select(ref, {noScroll:true}); }
  else if(k==='ArrowRight' && ref.kind!=='field'){ e.preventDefault(); if(node.dataset.open==='false') row.querySelector('.caret').click(); else rows[i+1]?.focus(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); if(ref.kind!=='field' && node.dataset.open==='true') row.querySelector('.caret').click(); else node.parentElement.closest('.node')?.querySelector('.row')?.focus(); }
  else if(k==='Delete' || (k==='Backspace' && mod)){ e.preventDefault(); deleteRef(ref); }
  else if(e.altKey && (k==='ArrowUp'||k==='ArrowDown')){ e.preventDefault(); moveRef(ref, k==='ArrowUp'?-1:1); setTimeout(()=>$(`.node[data-id="${ref.id}"] .row`, tree)?.focus(), 0); }
  else if(mod && k.toLowerCase()==='d'){ e.preventDefault(); duplicateRef(ref); }
  else if(k==='F2'){ e.preventDefault(); select(ref, {focus: ref.kind==='field'?'label':'title'}); }
  else if(k==='ContextMenu' || (e.shiftKey && k==='F10')){ e.preventDefault(); openMenu(null, ref, row.querySelector('.more')); }
});

/* drag to reorder (same kind; fields can cross screens, screens cross sections) */
let drag = null;
tree.addEventListener('dragstart', e => { const node = e.target.closest('.node'); if(!node) return; drag = {kind:node.dataset.kind, id:node.dataset.id}; node.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', node.dataset.id); e.stopPropagation(); });
tree.addEventListener('dragend', () => { drag=null; $$('.node', tree).forEach(n=>n.classList.remove('dragging','drop-before','drop-after','drop-into')); });
tree.addEventListener('dragover', e => {
  if(!drag) return; const node = e.target.closest('.node'); if(!node || node.dataset.id===drag.id) return;
  const kind = node.dataset.kind; const into = (drag.kind==='field' && kind==='screen') || (drag.kind==='screen' && kind==='section');
  if(kind!==drag.kind && !into) return; if(node.querySelector(`.node.dragging`)) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  $$('.node', tree).forEach(n=>n.classList.remove('drop-before','drop-after','drop-into'));
  if(into){ node.classList.add('drop-into'); return; }
  const rect = node.querySelector('.row').getBoundingClientRect(); node.classList.add(e.clientY < rect.top + rect.height/2 ? 'drop-before' : 'drop-after');
});
tree.addEventListener('drop', e => {
  if(!drag) return; const node = e.target.closest('.node'); if(!node) return; e.preventDefault();
  const target = {kind:node.dataset.kind, id:node.dataset.id}; const into = node.classList.contains('drop-into'); const before = node.classList.contains('drop-before');
  if(!into && !before && !node.classList.contains('drop-after')) return;
  const moving = drag; commit(()=>{ const item = detach(moving); if(into){ const r = find(target); const list = r.screen ? r.screen.fields : r.section.screens; (r.screen||r.section).open = true; list.push(item); } else { const list = parentList(target); const idx = list.findIndex(x=>x.id===target.id); list.splice(before?idx:idx+1, 0, item); } });
  toast('Moved');
});

function moveRef(ref, dir){ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); const j = i+dir; if(j<0||j>=list.length){ toast(dir<0?'Already first':'Already last'); return; } commit(()=>{ [list[i],list[j]]=[list[j],list[i]]; }); }
function deleteRef(ref, o={}){
  const r = find(ref); if(!r) return; const name = r.field?.label || r.screen?.title || r.section?.title; const list = parentList(ref);
  if(ref.kind==='section' && state.sections.length===1) return toast('Keep at least one section','warn');
  const gone = ref.kind==='field' ? [r.field] : ref.kind==='screen' ? r.screen.fields : r.section.screens.flatMap(x=>x.fields); const goneIds = new Set(gone.map(f=>f.id));
  const paths = gone.map(f=>f.map).filter(m=>m && !allFields().some(x=>x.map===m && !goneIds.has(x.id)));
  const deps = rulesDependingOn(paths, [...goneIds, ref.id]);
  if(deps.length && !o.withRules) return confirm2(`Delete “${name}”?`, `${deps.length===1?'A rule depends':deps.length+' rules depend'} on it and will be removed too: ${deps.map(d=>`“${d.kind==='field'?d.o.label:d.o.title}”`).join(', ')}.`, 'Delete both', ()=>deleteRef(ref, {withRules:true}), true);
  commit(()=>{ const P = new Set(paths); for(const d of deps) d.o.conditions = d.o.conditions.filter(c=>!P.has(c.field)); const i = list.findIndex(x=>x.id===ref.id); list.splice(i,1); if(sel.id===ref.id || !find(sel)){ const next = list[Math.min(i, list.length-1)]; if(next) sel = {kind:ref.kind, id:next.id}; else if(ref.kind==='field') sel = {kind:'screen', id:r.screen.id}; else if(ref.kind==='screen') sel = {kind:'section', id:r.section.id}; else sel = {kind:'section', id:state.sections[0].id}; } });
  toast(`Deleted “${name}”`, 'ok', {label:'Undo', fn:undo});
}
function duplicateRef(ref){ const r = find(ref); if(!r || ref.kind==='section') return toast('Sections can’t be duplicated'); commit(()=>{ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); const copy = clone(list[i]); reId(copy); copy[ref.kind==='field'?'label':'title'] += ' copy'; list.splice(i+1,0,copy); sel = {kind:ref.kind, id:copy.id}; }); toast('Duplicated'); }

/* context menu */
const menu = $('#ctxmenu');
function openMenu(e, ref, anchor){
  const r = find(ref); const k = ref.kind; const items = [];
  items.push({l:'Rename', i:'i-text', fn:()=>select(ref,{focus:k==='field'?'label':'title'}), kbd:'F2'});
  if(k!=='section') items.push({l:'Duplicate', i:'i-copy', fn:()=>duplicateRef(ref), kbd:'⌘D'});
  items.push({l:'Move up', i:'i-arrow-up', fn:()=>moveRef(ref,-1), kbd:'⌥↑'}, {l:'Move down', i:'i-arrow-down', fn:()=>moveRef(ref,1), kbd:'⌥↓'});
  if(k==='section') items.push({sep:true},{l:'Add screen', i:'i-plus', fn:()=>addScreen(r.section.id)});
  if(k==='screen') items.push({sep:true},{l:'Add field', i:'i-plus', fn:()=>openTypePicker(r.screen.id)}, {l:'Test from here', i:'i-eye', fn:()=>{ setMode('test'); const idx = testScreens().indexOf(r.screen); ui.testIdx = Math.max(0, idx); renderCanvas({anim:true}); }});
  items.push({sep:true},{l:'Delete', i:'i-trash', fn:()=>deleteRef(ref), danger:true, kbd:'⌫'});
  const at = e?.type==='contextmenu' && (e.clientX || e.clientY) ? {x:e.clientX, y:e.clientY} : null;

/* Opens at the pointer for a right-click; otherwise under the control that opened it (above it when there's no room). */
let menuTimer = null, menuAnchor = null;
function showMenu(items, anchor, at){
  clearTimeout(menuTimer); menuAnchor = anchor;

const VERS = LS+'.versions';
function loadVersions(){ try{ return JSON.parse(localStorage.getItem(VERS)) || []; }catch(e){ return []; } }
function ago(t){ const m = Math.round((Date.now()-t)/60000); if(m<1) return 'just now'; if(m<60) return `${m} min ago`; const h = Math.round(m/60); if(h<24) return `${h} h ago`; return `${Math.round(h/24)} d ago`; }
function restoreVersion(v){ commit(()=>{ state = {...state, name:v.name, brand:clone(v.brand), style:clone(v.style), styles:clone(v.styles), sections:clone(v.sections)}; state.sections[0].open = true; sel = {kind:'screen', id:state.sections[0].screens[0]?.id}; }); applyBrand(); $('#formName').textContent = state.name; toast(`Restored ${v.rev}`, 'ok'); }
function openHistory(){ const vs = loadVersions(); const live = liveRev();
  modal(`<div class="mh"><h2>Version history</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="mb">${vs.length ? `<ul class="checklist">${vs.map((v,i)=>`<li><span class="ci ${v.rev===live?'ok':'chg'}">${icon(v.rev===live?'i-check':'i-send',12)}</span><b>${esc(v.note||'No release note')}<span class="sub2">${v.rev} · ${ago(v.at)}${v.rev===live?' · live now':''}</span></b><button class="btn sm" data-restore="${i}">Restore</button></li>`).join('')}</ul>` : `<div class="empty"><b>No versions yet</b>Every publish is kept here.</div>`}</div>`,
    m => { m.addEventListener('click', e => { const b = e.target.closest('[data-restore]'); if(!b) return; const v = vs[+b.dataset.restore]; closeModal(); setTimeout(()=>confirm2(`Restore ${v.rev}?`, 'Your draft becomes this version. Undo is available afterwards.', 'Restore', ()=>restoreVersion(v)), 160); }); });
}
function openPublish(){
  ui.iss = computeIssues(); syncIssues(); const {issues, blockers} = ui.iss; const blocks = issues.filter(i=>i.sev==='block'), warns = issues.filter(i=>i.sev==='warn');
  const changes = changesSinceLive(); const first = changes===null; const none = changes && !changes.length; const SHOW = 8;
  const irow = (c,i) => `<li class="${c.go||c.fix?'clk':''}" data-iss="${i}"><span class="ci ${c.sev}">${icon(c.sev==='block'?'i-x':'i-warn',12)}</span><b>${esc(c.l)}${c.s?`<span class="sub2">${esc(c.s)}</span>`:''}</b>${c.fix?`<button class="btn sm" data-fix="${i}">${fixLabel(c.fix)}</button>`:''}</li>`;
  modal(`<div class="mh"><h2>Review &amp; publish</h2>${liveRev()?`<button class="pill mono" data-act="history" data-tip="Version history" data-tip-pos="bottom">live ${liveRev()}</button>`:''}<button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="mb">
      ${blocks.length ? `<div class="f"><label>Fix before publishing · ${blocks.length}</label><ul class="checklist">${blocks.map((c,i)=>irow(c, issues.indexOf(c))).join('')}</ul></div>` : ''}
      ${warns.length ? `<div class="f"><label>Worth a look · ${warns.length}</label><ul class="checklist">${warns.map(c=>irow(c, issues.indexOf(c))).join('')}</ul></div>` : ''}
      ${!issues.length ? `<div class="note ok">${icon('i-check')}<span>Every check passes.</span></div>` : ''}
      <div class="f"><label>${first?'First publish':none?'Changes since live':`Changes since live · ${changes.length}`}</label>
        ${first ? `<div class="empty"><b>Nothing is live yet</b>Publishing makes the whole form available to new borrowers.</div>` : none ? `<div class="empty"><b>Up to date</b>The draft matches what borrowers see.</div>` : `<ul class="checklist">${changes.slice(0,SHOW).map((c,i)=>crow(c,i,c.go||c.tab?'clk':'')).join('')}${changes.length>SHOW?`<li><span class="ci chg">${icon('i-more',12)}</span><b>${changes.length-SHOW} more</b></li>`:''}</ul>`}</div>
      <div class="f"><label>Release note</label><input class="ctl" id="relNote" placeholder="What changed? Optional"></div></div>
    <div class="mf">${changes&&changes.length?`<button class="btn ghost" id="discardDraft">Discard draft</button>`:''}<span style="flex:1"></span><button class="btn" data-close>Not yet</button><button class="btn primary" id="doPublish" ${none||blockers?'disabled':''}>${blockers?`Fix ${blockers} first`:none?'Up to date':'Publish'}</button></div>`,
    m => { m.addEventListener('click', e=>{ const fb = e.target.closest('[data-fix]'); if(fb){ e.stopPropagation(); closeModal(); applyFix(issues[+fb.dataset.fix].fix); return; }
        const li = e.target.closest('li.clk'); if(!li) return; const c = li.dataset.iss!=null ? issues[+li.dataset.iss] : changes[+li.dataset.chg]; closeModal(); if(c.go) select({kind:c.go.kind, id:c.go.id}, {focus:c.go.focus}); else if(c.tab){ ui.tab = c.tab; renderInspector(); } else if(c.fix) applyFix(c.fix); });
      $('[data-act=history]', m)?.addEventListener('click', ()=>{ closeModal(); setTimeout(openHistory, 160); });
      $('#discardDraft', m)?.addEventListener('click', ()=>{ closeModal(); setTimeout(()=>confirm2('Discard draft changes?', 'Your draft goes back to the live version. Undo is available afterwards.', 'Discard', ()=>restoreVersion(loadLive()), true), 160); });
      $('#doPublish', m).onclick = ()=>{ const snap = clone({name:state.name, brand:state.brand, style:state.style, styles:state.styles, sections:state.sections}); snap.rev = hash(JSON.stringify(snap)); snap.at = Date.now(); snap.note = $('#relNote', m).value.trim(); try{ localStorage.setItem(LIVE, JSON.stringify(snap)); localStorage.setItem(VERS, JSON.stringify([snap, ...loadVersions().filter(v=>v.rev!==snap.rev)].slice(0,20))); }catch(e){} closeModal(); persist(); markSaved(); toast(`Published ${snap.rev} — live for new borrowers`,'ok'); }; });
}
function openJson(){
  modal(`<div class="mh"><h2>Form JSON</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="mb"><textarea class="ctl code" id="jsonBox" style="min-height:48vh" spellcheck="false">${esc(JSON.stringify(exportForm(),null,2))}</textarea><div class="note">${icon('i-info')}<span>Applying replaces the whole form. Undo works afterwards.</span></div></div>
    <div class="mf"><button class="btn" data-act="fmt">Format</button><span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="applyJson">Apply</button></div>`,
    m => { $('[data-act=fmt]',m).onclick=()=>{ try{ $('#jsonBox').value = JSON.stringify(JSON.parse($('#jsonBox').value),null,2); }catch(err){ toast('Invalid JSON — '+err.message,'warn'); } }; $('#applyJson', m).onclick = ()=>{ try{ const next = parseForm(JSON.parse($('#jsonBox').value)); closeModal(); setTimeout(()=>previewImport(next), 160); }catch(err){ toast('Invalid JSON — '+err.message,'warn'); } }; });
}
const LIBRARY = [['Co-borrower email','email','coborrower.email'],['Preferred language','select','borrower.language',['English','Spanish','Mandarin','Vietnamese']],['How did you hear about us?','choice','marketing.source',['Referral','Search','Social','Other']],['Down payment amount','currency','loan.down_payment'],['Estimated credit score','select','credit.self_reported',['760+','720–759','680–719','640–679','Below 640']],['Rate lock preference','choice','loan.rate_lock',['Lock now','Float','Not sure']],['Mailing address','address','borrower.mailing.street'],['Best time to call','select','borrower.contact_window',['Morning','Afternoon','Evening']]];
function openLibrary(){ const scr = currentScreen(); if(!scr) return toast('Pick a screen first','warn');
  modal(`<div class="mh"><h2>Question library</h2><span class="pill">Adds to “${esc(scr.title)}”</span><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><div class="search" style="margin:0"><svg width="14" height="14"><use href="#i-search"/></svg><input id="libQ" placeholder="Search library" autocomplete="off"></div><ul class="checklist" id="libList">${LIBRARY.map(([l,t,m],i)=>`<li class="clk" data-lib="${i}"><span class="ico" style="color:var(--t3)">${icon(TYPES[t].icon)}</span><b>${l}</b><span>${TYPES[t].label}</span></li>`).join('')}</ul></div>`,
  m => { const q=$('#libQ',m); q.oninput=()=>$$('li',m).forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(q.value.toLowerCase())); m.addEventListener('click', e=>{ const li=e.target.closest('[data-lib]'); if(!li) return; const [l,t,map,o]=LIBRARY[+li.dataset.lib]; closeModal(); commit(()=>{ const f=F(l,t,{map}); if(o) f.options=opts(...o); scr.open=true; scr.fields.push(f); sel={kind:'field',id:f.id}; }); toast(`Added “${l}”`,'ok'); }); q.focus(); }); }
function openForms(){ const forms=[['Loan application','5361ace','Live · edited today',true],['Loan application (Spanish)','a91c0f2','Draft · 3 days ago'],['HELOC intake','77be104','Draft · last week']]; modal(`<div class="mh"><h2>Saved forms</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><ul class="checklist">${forms.map(([n,r,s,cur])=>`<li class="clk"><span class="ico" style="color:var(--t3)">${icon('i-form')}</span><b>${n}</b><span class="pill mono" style="margin-right:6px">${r}</span><span>${cur?'Open now':s}</span></li>`).join('')}</ul><div class="note">${icon('i-info')}<span>Only this form is stored in the prototype.</span></div></div>`, m=>m.addEventListener('click',e=>{ if(e.target.closest('li')){ closeModal(); toast('Only this form is available in the prototype'); } })); }
function newForm(){ modal(`<div class="mh"><h2>New form</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><div class="f"><label>Name</label><input class="ctl" id="newName" placeholder="e.g. HELOC intake"></div><div class="f"><label>Start from</label>${selectHtml('tpl','blank',[['blank','Blank'],['copy','Copy of this form'],['sample','Sample loan application']])}</div></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="mkForm">Create</button></div>`, m=>{ const go=()=>{ const n=$('#newName').value.trim()||'Untitled form'; const tpl=$('[data-bind=tpl]',m).value; closeModal(); commit(()=>{ if(tpl==='blank'){ state={name:n, brand:clone(state.brand), style:clone(state.style), styles:[], sections:[SEC('Getting started',[S('Welcome',[])],{open:true})]}; } else if(tpl==='sample'){ state=seed(); state.name=n; } else { state=clone(state); state.name=n; } sel={kind:'screen',id:state.sections[0].screens[0].id}; }); $('#formName').textContent=state.name; applyBrand(); toast(`Created “${n}”`,'ok'); }; $('#mkForm',m).onclick=go; $('#newName').onkeydown=e=>{ if(e.key==='Enter') go(); }; }); }
$('#dockCmd').onclick = openPalette;
/* A persona pre-answers the branching questions, keyed by loan-file path so it survives relabelling. */
const PERSONAS = [
  {k:'blank', l:'Blank', a:{}},
  {k:'buyer', l:'Home buyer', a:{'property.purpose':'buy_a_home','property.search_stage':'under_contract','property.type':'single_family','property.occupancy':'primary_residence','borrower.current.status':'rent','income.status':'employed'}},
  {k:'refi', l:'Refinance', a:{'property.purpose':'refinance','property.occupancy':'primary_residence','borrower.current.status':'own','income.status':'employed'}},
  {k:'investor', l:'Investor', a:{'property.purpose':'buy_a_home','property.search_stage':'actively_looking','property.type':'multi_family','property.occupancy':'investment','borrower.current.status':'own','income.status':'self_employed'}},
  {k:'entity', l:'Business entity', a:{'property.purpose':'buy_a_home','property.occupancy':'investment','borrower.entity':'yes','entity.type':'llc','income.status':'self_employed'}},
];
function startAs(k, o={}){ const p = PERSONAS.find(x=>x.k===k) || PERSONAS[0]; ui.persona = p.k; ui.answers = {}; for(const [m,v] of Object.entries(p.a)){ const f = allFields().find(x=>x.map===m); if(f) ui.answers[f.id] = v; } ui.errors = {}; ui.done = false; const cur = currentScreen(); ui.testIdx = o.fromStart ? 0 : Math.max(0, testScreens().indexOf(cur)); $('#dockPersonaL').textContent = p.k==='blank' ? 'Start as…' : p.l; renderCanvas({anim:true}); $('#stageScroll').scrollTo({top:0}); }
$('#dockRestart').onclick = ()=>startAs(ui.persona, {fromStart:true});
$('#dockPersona').onclick = e => showMenu(PERSONAS.map(p=>({l:p.l, i:p.k===ui.persona?'i-check':'i-person', fn:()=>startAs(p.k)})), e.currentTarget);
$('#dockExit').onclick = ()=>setMode('edit');
$('#dockUndo').onclick = undo; $('#dockRedo').onclick = redo;
$('#savePill').onclick = saveDraft; $('#publishBtn').onclick = openPublish;

/* search */
$('#treeSearch').addEventListener('input', e => { ui.query = e.target.value.trim(); renderTree(); });
$('#treeSearch').addEventListener('keydown', e => { if(e.key==='Escape'){ e.target.value=''; ui.query=''; renderTree(); e.target.blur(); } if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); $('#tree .row')?.focus(); } });

/* global shortcuts */
document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable; const mod = e.metaKey || e.ctrlKey; const k = e.key;
  if(mod && k.toLowerCase()==='k'){ e.preventDefault(); return scrim.dataset.open==='true' ? closeModal() : openPalette(); }
  if(mod && k.toLowerCase()==='s'){ e.preventDefault(); return saveDraft(); }
  if(mod && k==='\\'){ e.preventDefault(); return togglePanel('left'); }
  if(mod && k==='/'){ e.preventDefault(); return togglePanel('right'); }
  if(mod && k.toLowerCase()==='z' && !(inField && !e.target.classList.contains('scr-title'))){ e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if(k==='Escape'){ if(scrim.dataset.open==='true') return closeModal(); if(menu.dataset.open==='true') return closeMenu(); if(ui.mode==='test') return setMode('edit'); if(narrow()){ setPanel('left', false); setPanel('right', false); } else if(layout()==='tablet') setPanel('right', false); return; }
  if(inField || scrim.dataset.open==='true') return;
  if(mod && k.toLowerCase()==='d'){ e.preventDefault(); return duplicateRef(sel); }
  if(k==='/'){ e.preventDefault(); $('#treeSearch').focus(); }
  if(k==='?'){ e.preventDefault(); openShortcuts(); }
  if(k.toLowerCase()==='p' && !mod){ setMode(ui.mode==='edit'?'test':'edit'); }
  if(k.toLowerCase()==='m' && !mod){ setDevice(ui.device==='mobile'?'desktop':'mobile'); }
  if((k==='Delete' || (k==='Backspace' && mod)) && !e.target.closest('.tree')){ e.preventDefault(); deleteRef(sel); }
  if(e.altKey && (k==='ArrowRight'||k==='ArrowLeft')){ e.preventDefault(); const scr = allScreens(); const i = scr.indexOf(currentScreen()); const n = scr[i + (k==='ArrowRight'?1:-1)]; if(n) select({kind:'screen',id:n.id}); }
  if(e.altKey && (k==='ArrowUp'||k==='ArrowDown') && !e.target.closest('.tree')){ e.preventDefault(); moveRef(sel, k==='ArrowUp'?-1:1); }
});
addEventListener('beforeunload', e => { if(ui.dirty){ persist(); } });

/* boot */
(function boot(){
  if(prefs.theme) setTheme(prefs.theme); else $('#themeBtn').innerHTML = icon(matchMedia('(prefers-color-scheme: dark)').matches?'i-sun':'i-moon',16);
  if(prefs.leftW) document.documentElement.style.setProperty('--left', prefs.leftW+'px'); if(prefs.rightW) document.documentElement.style.setProperty('--right', prefs.rightW+'px');
  applyLayout();
  $('#formName').textContent = state.name; applyBrand(); renderAll(); syncHistory(); markSaved();
  setDevice(prefs.device || (innerWidth<700?'mobile':'desktop')); requestAnimationFrame(()=>{ segThumb($('#modeSeg')); segThumb($('#devSeg')); });
  document.fonts?.ready.then(()=>{ segThumb($('#modeSeg')); segThumb($('#devSeg')); });
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('preload')));
})();
</script>
</body>
