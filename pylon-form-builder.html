<!doctype html>
<html lang="en" class="preload">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pylon Form Builder</title>
<meta name="description" content="A single-file form builder for Pylon intake: structure, live canvas with test mode, and a focused inspector. Resizable panes, brand and type controls, keyboard-first." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Tokens. One neutral ramp, one accent (selection only), brand
   color is borrower-facing and lives inside the preview frame.
   ============================================================ */
:root{
  --bg:#f4f4f3; --panel:#ffffff; --panel-2:#f8f8f7; --panel-3:#efefed; --canvas:#eeeeec;
  --line:#e6e5e2; --line-2:#d8d6d2; --line-3:#b9b6b0;
  --t1:#18181a; --t2:#5c5b57; --t3:#73716b; --t4:#b9b6b0; /* borders and disabled icons only, never text */
  --ink:#18181a; --ink-fg:#ffffff; --ink-soft:rgba(24,24,26,.06); --ink-soft-2:rgba(24,24,26,.1);
  --sel:#2f6df6; --sel-fg:#ffffff; --sel-soft:rgba(47,109,246,.09); --sel-ring:rgba(47,109,246,.3);
  --ok:#1a9d55; --warn:#d58a12; --err:#d93838; --err-soft:rgba(217,56,56,.08);
  --sh-1:0 1px 2px rgba(20,20,22,.06); --sh-2:0 6px 20px rgba(20,20,22,.08),0 1px 2px rgba(20,20,22,.05);
  --sh-3:0 20px 50px rgba(20,20,22,.16),0 2px 6px rgba(20,20,22,.08);
  /* Radius by role: r0 marks, r1 ≤28px controls, rs 32px controls, r2 rows and cards, r3 floating surfaces, r4 the preview frame. */
  --r0:4px; --r1:6px; --rs:8px; --r2:10px; --r3:14px; --r4:20px;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --left:292px; --right:340px; --top:52px;
  --ease:cubic-bezier(.2,.8,.2,1); --fast:140ms; --med:220ms; --slow:360ms;
  --brand:#18181a; --brand-fg:#ffffff;
  --frame-font:var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111112; --panel:#19191b; --panel-2:#151517; --panel-3:#202023; --canvas:#111112;
  --line:#27272a; --line-2:#323236; --line-3:#4b4b50;
  --t1:#f2f2f0; --t2:#b3b2ad; --t3:#8e8d88; --t4:#4e4e52;
  --ink:#f2f2f0; --ink-fg:#111112; --ink-soft:rgba(242,242,240,.07); --ink-soft-2:rgba(242,242,240,.12);
  --sel:#5b8cff; --sel-soft:rgba(91,140,255,.12); --sel-ring:rgba(91,140,255,.35);
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 6px 20px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); --sh-3:0 20px 50px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5);
  --brand:#f2f2f0; --brand-fg:#111112;
}}
:root[data-theme="dark"]{
  --bg:#111112; --panel:#19191b; --panel-2:#151517; --panel-3:#202023; --canvas:#111112;
  --line:#27272a; --line-2:#323236; --line-3:#4b4b50;
  --t1:#f2f2f0; --t2:#b3b2ad; --t3:#8e8d88; --t4:#4e4e52;
  --ink:#f2f2f0; --ink-fg:#111112; --ink-soft:rgba(242,242,240,.07); --ink-soft-2:rgba(242,242,240,.12);
  --sel:#5b8cff; --sel-soft:rgba(91,140,255,.12); --sel-ring:rgba(91,140,255,.35);
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 6px 20px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); --sh-3:0 20px 50px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5);
  --brand:#f2f2f0; --brand-fg:#111112;
}

/* ============================================================ Base */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:13px;line-height:1.45;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}
::selection{background:var(--sel-soft)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:var(--r1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:var(--r0);border:1px solid var(--line-2);background:var(--panel-2);color:var(--t3);line-height:1.5;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:padding-box;border:2px solid transparent}
[hidden]{display:none!important}
.preload *,.preload *::before,.preload *::after{transition:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--rs);border:1px solid var(--line-2);background:var(--panel);font-weight:500;color:var(--t1);white-space:nowrap;transition:background var(--fast),border-color var(--fast),color var(--fast),transform 60ms,box-shadow var(--fast)}
.btn:hover{background:var(--panel-2);border-color:var(--line-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--panel));border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--ink-soft);color:var(--t1)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--r1)}
.btn.sm.icon{width:28px}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}.btn.danger:hover{background:color-mix(in srgb,var(--err) 88%,#000);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn .kbd{margin-left:2px}
.btn .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--err);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;margin:0 -3px 0 1px}

/* Segmented control */
/* Segmented control, 32px (26px buttons + 2px padding + 1px border). .seg.round is the 28px capsule variant. */
.seg{display:inline-flex;position:relative;background:var(--panel-3);border-radius:var(--rs);padding:2px;gap:2px;border:1px solid var(--line)}
.seg.eq{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);min-width:max-content}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:26px;padding:0 12px;border-radius:calc(var(--rs) - 3px);font-weight:500;color:var(--t2);transition:color var(--fast)}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed="true"]{color:var(--t1)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:0;background:var(--panel);border-radius:calc(var(--rs) - 3px);box-shadow:var(--sh-1);transition:transform var(--med) var(--ease),width var(--med) var(--ease);z-index:0}
.seg.icons button{width:30px;padding:0}
.seg.round,.seg.round .thumb,.seg.round button{border-radius:999px}.seg.round button{height:22px;width:28px}

/* Tooltips */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translate(-50%,2px);background:var(--t1);color:var(--bg);font-size:12px;font-weight:500;padding:5px 8px;border-radius:var(--r1);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--fast),transform var(--fast);z-index:40;font-family:var(--font);letter-spacing:0;text-transform:none}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);transition-delay:500ms}
[data-tip]:focus-visible::after{transition-delay:0ms}
[data-tip-pos="bottom"]::after{bottom:auto;top:calc(100% + 7px);transform:translate(-50%,-2px)}
[data-tip-pos="bottom"]:hover::after{transform:translate(-50%,0)}
[data-tip-pos="left"]::after{bottom:auto;left:auto;right:calc(100% + 7px);top:50%;transform:translate(2px,-50%)}
[data-tip-pos="left"]:hover::after{transform:translate(0,-50%)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel-3);color:var(--t2);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);transition:background var(--med)}
.pill.dirty .dot{background:var(--warn)}
button.pill{transition:background var(--fast),color var(--fast)}button.pill:hover{background:var(--ink-soft-2);color:var(--t1)}
.pill.mono{font-family:var(--mono);font-size:11px}

/* ============================================================ Shell */
.app{display:grid;grid-template-rows:var(--top) 1fr;grid-template-columns:var(--left) 1fr var(--right);height:100vh;height:100dvh;transition:grid-template-columns var(--med) var(--ease)}
.app.resizing{transition:none;user-select:none;cursor:col-resize}
.app[data-left="closed"]{grid-template-columns:0 1fr var(--right)}
.app[data-right="closed"]{grid-template-columns:var(--left) 1fr 0}
.app[data-left="closed"][data-right="closed"]{grid-template-columns:0 1fr 0}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20;gap:8px}
.topbar .l,.topbar .r{display:flex;align-items:center;gap:6px;min-width:0}
.topbar .r{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;padding:4px 6px;border-radius:var(--r1);white-space:nowrap}
.mark{width:24px;height:24px;border-radius:30%;background:var(--ink);display:grid;place-items:center;color:var(--ink-fg);flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.name-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--rs);font-weight:600;font-size:14px;color:var(--t1);min-width:0;transition:background var(--fast)}
.name-btn:hover{background:var(--ink-soft)}
.name-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.name-btn svg{color:var(--t3)}
.topbar .sep{color:var(--t3);margin:0 2px}

/* Panels */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.panel.left{border-right:1px solid var(--line);grid-column:1}
.panel.right{border-left:1px solid var(--line);grid-column:3}
/* Children keep their full width while a panel animates closed; the 10px-inset ones subtract their margins. */
.panel>*:not(.resizer){min-width:var(--pw)}
.panel>.search,.panel>.tabs{min-width:calc(var(--pw) - 20px)}
.panel.left{--pw:var(--left)}.panel.right{--pw:var(--right)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 10px 0 14px;flex:none}
.ph .t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}
.ph .meta{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.resizer{position:absolute;top:0;bottom:0;width:7px;min-width:0;cursor:col-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background var(--fast)}
.resizer:hover::after,.resizer.on::after{background:var(--sel)}
.panel.left .resizer{right:-4px}.panel.right .resizer{left:-4px}

/* ============================================================ Tree */
.search{position:relative;margin:0 10px 6px;flex:none}
.search input{width:100%;height:32px;padding:0 10px 0 32px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel-2);transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
.search input::placeholder{color:var(--t3)}
.search input:focus{outline:0;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-ring);background:var(--panel)}
.search>svg{position:absolute;left:10px;top:9px;color:var(--t3);pointer-events:none}
.tree{flex:1;padding:2px 8px 84px}
.node{position:relative;user-select:none}
.row{display:flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 4px;border-radius:var(--r1);color:var(--t2);cursor:pointer;position:relative;transition:background var(--fast),color var(--fast)}
.row:hover{background:var(--ink-soft);color:var(--t1)}
.row[aria-selected="true"]{background:var(--sel-soft);color:var(--t1)}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .lbl mark{background:var(--sel-ring);color:var(--t1);border-radius:var(--r0);padding:0 1px}
.row.sect .lbl{font-weight:600;color:var(--t1)}
.row.sect{height:32px}
.row .n{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;padding:0 4px;opacity:0;transition:opacity var(--fast)}
.row:hover .n{opacity:1}
.row .caret,.row .caret-sp{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--r1);color:var(--t3);flex:none}
.row .caret{transition:transform var(--med) var(--ease),background var(--fast)}
.row .caret:hover{background:var(--ink-soft-2);color:var(--t1)}
.node[data-open="false"]>.row .caret{transform:rotate(-90deg)}
.kids{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.kids>div{overflow:hidden;min-height:0}
.node[data-open="false"]>.kids{grid-template-rows:0fr}
/* Each level indents 16px; a screen's guide line runs under its caret, in the gutter left of its fields. */
.node.sect>.kids>div{padding-left:16px}
.node.scr>.kids>div{padding-left:18px;position:relative}
.node.scr>.kids>div::before{content:"";position:absolute;left:14px;top:2px;bottom:4px;width:1px;background:var(--line)}
.row .ico{width:16px;height:16px;display:grid;place-items:center;color:var(--t3);flex:none}
.row.fld{height:28px}
.row .flag{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;margin:0 4px}.row .flag.block{background:var(--err)}
.row .more{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r1);color:var(--t3);opacity:0;flex:none;transition:opacity var(--fast),background var(--fast)}
.row:hover .more,.row:focus-within .more{opacity:1}
.row .more:hover{background:var(--ink-soft-2);color:var(--t1)}
.node.dragging>.row{opacity:.35}
.node.drop-before>.row::after,.node.drop-after>.row::after{content:"";position:absolute;left:26px;right:6px;height:2px;background:var(--sel);border-radius:2px;z-index:2}
.node.drop-before>.row::after{top:-1px}.node.drop-after>.row::after{bottom:-1px}
.node.drop-into>.row{box-shadow:inset 0 0 0 1.5px var(--sel)}
.tree-empty{padding:32px 16px;text-align:center;color:var(--t3)}
.tree-empty b{display:block;color:var(--t2);font-weight:600;margin-bottom:2px}
.tree-foot{position:absolute;bottom:0;left:0;right:0;padding:10px 12px 12px;display:flex;gap:6px;background:linear-gradient(to top,var(--panel) 75%,transparent)}
.tree-foot .btn{flex:1;min-width:0}

/* ============================================================ Canvas */
.stage{position:relative;background:var(--canvas);min-width:0;display:flex;flex-direction:column;overflow:hidden;grid-column:2}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;flex:none;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--t3);white-space:nowrap}
.crumb .c{overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer;transition:color var(--fast)}
.crumb .c:hover{color:var(--t1)}
.crumb .c.cur{color:var(--t1);font-weight:600}
.crumb .sep{color:var(--t3);flex:none}
.stage-tools{display:flex;align-items:center;gap:6px;flex:none}
.stage-tools .seg{background:var(--panel);border-color:var(--line)}
.stage-tools .seg .thumb{background:var(--panel-3);box-shadow:none}
.zoom{display:inline-flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px;height:28px}
.zoom button{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;color:var(--t2);transition:background var(--fast)}
.zoom button:hover{background:var(--ink-soft);color:var(--t1)}
.zoom span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--t2);min-width:40px;text-align:center;cursor:pointer}
.stage-scroll{flex:1;display:block;padding:8px clamp(16px,4vw,48px) 120px;scrollbar-gutter:stable}
.device{margin:0 auto;transition:width var(--slow) var(--ease),height var(--med) var(--ease)}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);box-shadow:var(--sh-2);overflow:hidden;transform-origin:top left;transition:transform var(--med) var(--ease),width var(--slow) var(--ease);font-family:var(--frame-font);color-scheme:light}
.frame[data-scheme="light"]{--fp:#ffffff;--fp2:#f6f6f5;--fl:#e6e5e2;--fl2:#d4d2cd;--ft1:#18181a;--ft2:#5c5b57;--ft3:#73716b}
.frame[data-scheme="dark"]{--fp:#18181a;--fp2:#1f1f22;--fl:#2b2b2f;--fl2:#3a3a40;--ft1:#f2f2f0;--ft2:#b3b2ad;--ft3:#8e8d88;color-scheme:dark}
.frame{background:var(--fp);color:var(--ft1)}
.frame-top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--fl);background:var(--fp2)}
.frame-top .lg{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.frame-top .lg .mark{width:20px;height:20px;border-radius:30%;background:var(--brand);color:var(--brand-fg)}
.frame-top .steps{font-family:var(--mono);font-size:11px;color:var(--ft3)}
.progress{height:3px;background:var(--fl)}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width var(--slow) var(--ease)}
.scr-body{padding:40px clamp(20px,7%,56px) 44px;min-height:380px;display:flex;flex-direction:column;gap:18px}
.scr-in{animation:scrin var(--slow) var(--ease)}
@keyframes scrin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scr-title{position:relative;text-align:center;font-size:var(--title-size,24px);font-weight:var(--title-weight,600);letter-spacing:-.02em;line-height:1.25;margin:0;padding:6px 10px;border-radius:var(--r2);transition:box-shadow var(--fast)}
.scr-title:empty::before{content:"Untitled screen";color:var(--ft3)}
.stage[data-mode="edit"] .scr-title:hover{box-shadow:inset 0 0 0 1px var(--fl2)}
.stage[data-mode="edit"] .scr-title.sel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.scr-title[contenteditable]:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--sel),0 0 0 4px var(--sel-ring)}
.scr-desc{text-align:center;color:var(--ft2);margin:-8px 0 0;font-size:14px}
.fields{display:flex;flex-direction:column;gap:20px;max-width:520px;width:100%;margin:0 auto}
/* The edit outline sits 10px above and 6px below a field; fields are 20px apart, so outlines never touch and a field's tabs stay clear of the field above.
   The type tag and actions are 20px tabs centred on the outline's top edge, clear of the label. */
.fw{position:relative;border-radius:var(--r2);padding:10px 8px 6px;margin:-10px -8px -6px;transition:box-shadow var(--fast)}
.stage[data-mode="edit"] .fw{cursor:pointer}
.stage[data-mode="edit"] .fw:hover{box-shadow:inset 0 0 0 1px var(--fl2)}
.stage[data-mode="edit"] .fw.sel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.fw .hd{position:absolute;top:-10px;left:10px;right:10px;height:20px;display:flex;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity var(--fast);z-index:2}
.stage[data-mode="edit"] .fw:hover .hd,.stage[data-mode="edit"] .fw.sel .hd{opacity:1}
.stage[data-mode="edit"] .fw.sel .hd>*{pointer-events:auto}
.fw .tag{height:20px;display:inline-flex;align-items:center;padding:0 7px;border-radius:var(--r1);font-size:11px;font-weight:600;color:var(--ft2);background:var(--fp);box-shadow:inset 0 0 0 1px var(--fl2)}
.fw.sel .tag{color:#fff;background:var(--sel);box-shadow:none}
.fw .tag .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px}.fw .tag .dot.block{background:var(--err)}.fw.sel .tag .dot{background:#fff}
.fw .fx{display:flex;padding:0 2px;border-radius:var(--r1);background:var(--fp);box-shadow:inset 0 0 0 1px var(--fl2);opacity:0;transition:opacity var(--fast)}
.fw.sel .fx{opacity:1}
.fw .fx button{width:20px;height:20px;border-radius:var(--r1);display:grid;place-items:center;color:var(--ft2);transition:background var(--fast),color var(--fast)}
.fw .fx button:hover{background:var(--fl);color:var(--ft1)}
.fw .fx button.del:hover{background:var(--err-soft);color:var(--err)}
.fw.sel-in .hd{animation:fadein var(--fast) var(--ease)}
.fl{display:flex;align-items:baseline;gap:8px;font-weight:500;font-size:14px;margin-bottom:8px;color:var(--ft1)}
/* Label, help text and option text edit in place on the selected field. The box only appears on hover and focus. */
.ce{border-radius:var(--r0);padding:0 2px;margin:0 -2px;min-width:1ch;transition:box-shadow var(--fast),background var(--fast)}
.ce:empty::before{content:attr(data-ph);color:var(--ft3);font-weight:400}
.stage[data-mode="edit"] .fw.sel .ce{cursor:text}
.stage[data-mode="edit"] .fw.sel .ce:hover{box-shadow:inset 0 0 0 1px var(--fl2)}
.ce:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--sel),0 0 0 3px var(--sel-ring);background:var(--fp)}
.fw.sel .fd.ce:empty{display:block}
.fl .optl{color:var(--ft3);font-weight:400;font-size:13px}
.fd{color:var(--ft2);font-size:13px;margin:-4px 0 8px}
.ferr{display:flex;align-items:center;gap:6px;color:var(--err);font-size:13px;margin-top:8px;animation:scrin var(--med) var(--ease)}
.fw.err .choice,.fw.err .inp{border-color:var(--err)}
.fw.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border:1px solid var(--fl2);border-radius:var(--field-radius,12px);background:var(--fp);transition:border-color var(--fast),box-shadow var(--fast),transform 60ms;cursor:pointer;color:var(--ft1)}
.choice:hover{border-color:var(--ft3)}
.choice:active{transform:scale(.995)}
.choice.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.choice .ci{width:18px;height:18px;color:var(--ft2)}
.choice .ct{flex:1;font-weight:500;font-size:14px}
.choice .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--fl2);display:grid;place-items:center;color:var(--brand-fg);transition:background var(--fast),border-color var(--fast)}
.choice.on .ck{background:var(--brand);border-color:var(--brand)}
.choice .ck svg{opacity:0;transform:scale(.6);transition:opacity var(--fast),transform var(--fast)}
.choice.on .ck svg{opacity:1;transform:none}
.choice.multi .ck{border-radius:6px}
.inp{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid var(--fl2);border-radius:var(--field-radius,12px);background:var(--fp);color:var(--ft3);font-size:14px;transition:border-color var(--fast),box-shadow var(--fast)}
.inp .pre{font-weight:500;color:var(--ft2)}
.inp.ta{height:auto;min-height:92px;align-items:flex-start;padding-top:12px}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.inp input{flex:1;border:0;background:transparent;outline:0;min-width:0;color:var(--ft1);font:inherit}
.inp input::placeholder{color:var(--ft3)}
.inp svg{color:var(--ft3)}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yesno .choice{min-height:46px;justify-content:center}
.yesno .choice .ck{display:none}
.add-field{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:1px dashed var(--fl2);border-radius:var(--field-radius,12px);color:var(--ft3);font-weight:500;max-width:520px;width:100%;margin:4px auto 0;transition:border-color var(--fast),color var(--fast),background var(--fast)}
.add-field:hover{border-color:var(--ft3);color:var(--ft1);background:var(--fp2)}
.stage[data-mode="test"] .add-field{display:none}
.scr-nav{display:none;max-width:520px;width:100%;margin:10px auto 0;align-items:center;justify-content:space-between;gap:10px}
.stage[data-mode="test"] .scr-nav{display:flex}
.scr-nav .btn{height:44px;padding:0 20px;border-radius:var(--field-radius,12px);font-size:14px;background:var(--fp);border-color:var(--fl2);color:var(--ft1)}
.scr-nav .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.scr-empty{padding:36px 20px;text-align:center;color:var(--ft3);display:flex;flex-direction:column;align-items:center;gap:10px}
.scr-empty b{color:var(--ft2);font-weight:600}
.scr-empty .ic{width:40px;height:40px;border-radius:var(--r2);background:var(--fp2);display:grid;place-items:center;color:var(--ft3)}
.done{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:scrin var(--slow) var(--ease)}
.done .ic{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center}
.done h2{margin:6px 0 0;font-size:22px;letter-spacing:-.02em}
.done p{margin:0;color:var(--ft2)}

/* Dock */
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);z-index:10;max-width:calc(100% - 32px)}
.dock button{position:relative;width:32px;height:32px;border-radius:var(--r2);display:grid;place-items:center;color:var(--t2);transition:background var(--fast),color var(--fast);flex:none}
.dock button:hover{background:var(--ink-soft);color:var(--t1)}
.dock button:disabled{opacity:.3;cursor:not-allowed}
.dock button.danger:hover{background:var(--err-soft);color:var(--err)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.dock button.wide{width:auto;display:inline-flex;gap:6px;padding:0 12px;font-weight:500}
.stage[data-mode="edit"] .dock .ts,.stage[data-mode="test"] .dock .ed{display:none}
.m-close,.m-ph{display:none}

/* ============================================================ Inspector */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:8px 10px;padding:2px;background:var(--panel-3);border-radius:var(--rs);border:1px solid var(--line);position:relative;flex:none}
.tabs button{display:flex;align-items:center;justify-content:center;height:22px;border-radius:calc(var(--rs) - 3px);font-size:12px;font-weight:500;color:var(--t2);position:relative;z-index:1;transition:color var(--fast)}
.tabs button:hover{color:var(--t1)}
.tabs button[aria-selected="true"]{color:var(--t1)}
.tabs .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(25% - 2.5px);background:var(--panel);border-radius:calc(var(--rs) - 3px);box-shadow:var(--sh-1);transition:transform var(--med) var(--ease);z-index:0}
.insp{flex:1;padding:4px 0 48px;transition:opacity var(--med)}
.insp.fade>*{animation:fadein var(--fast) var(--ease)}
.app[data-mode="test"] .insp,.app[data-mode="test"] .tabs{opacity:.4;pointer-events:none}
.ictx{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-width:0}
.ictx .kind{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r1);background:var(--panel-3);color:var(--t2);font-size:11px;font-weight:600;flex:none}
.ictx .kind.field{background:var(--sel-soft);color:var(--sel)}
.ictx .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ictx .acts{display:flex;gap:2px;flex:none}
.ictx .acts button:not(.btn){width:28px;height:28px;border-radius:var(--r1);display:grid;place-items:center;color:var(--t3);transition:background var(--fast),color var(--fast)}
.ictx .acts .btn{white-space:nowrap}
.ictx .acts button:hover{background:var(--ink-soft);color:var(--t1)}
.ictx .acts button.del:hover{background:var(--err-soft);color:var(--err)}
.sec{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left;font-weight:600;font-size:13px;color:var(--t1);transition:background var(--fast)}
.sec-h:hover{background:var(--panel-2)}
.sec-h .hint{font-weight:400;color:var(--t3);font-size:12px;margin-left:auto}
.sec-h .chev{color:var(--t3);transition:transform var(--med) var(--ease);margin-left:6px}
.sec-h .hint+.chev{margin-left:6px}.sec-h .chev:only-of-type{margin-left:auto}
.sec[data-open="false"] .sec-h .chev{transform:rotate(-90deg)}
.sec-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.sec[data-open="false"] .sec-w{grid-template-rows:0fr}
.sec-w>div{overflow:hidden;min-height:0}
.sec-b{padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:12px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:6px}
.f .sub{font-size:11px;color:var(--t3)}
.ctl{height:32px;width:100%;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--rs);background:var(--panel);transition:border-color var(--fast),box-shadow var(--fast);min-width:0}
.ctl:hover{border-color:var(--line-3)}
.ctl:focus{outline:0;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-ring)}
.ctl::placeholder{color:var(--t3)}
textarea.ctl{height:auto;min-height:34px;padding:7px 10px;resize:none;line-height:1.45;transition:min-height var(--med) var(--ease),border-color var(--fast),box-shadow var(--fast)}
textarea.ctl:focus,textarea.ctl.has{min-height:68px}
textarea.code{font-family:var(--mono);font-size:12px;min-height:240px;background:var(--panel-2);white-space:pre;tab-size:2;resize:vertical}
textarea.code.snip{min-height:0;resize:none;line-height:1.6;overflow:auto}
.selw{position:relative;min-width:0}
.selw select{appearance:none;-webkit-appearance:none;padding-right:28px;cursor:pointer;text-overflow:ellipsis}
.selw::after{content:"";position:absolute;right:11px;top:11px;width:6px;height:6px;border-right:1.5px solid var(--t3);border-bottom:1.5px solid var(--t3);transform:rotate(45deg);pointer-events:none}
.ctl-ico{position:relative}
.ctl-ico .ctl{padding-left:30px}
.ctl-ico>svg{position:absolute;left:9px;top:9px;color:var(--t3);pointer-events:none}
.ctl-ico .unit{position:absolute;right:10px;top:8px;font-size:11px;color:var(--t3);pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .t{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background var(--med);flex:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--med) var(--ease)}
.sw input:checked+.t{background:var(--ink)}
.sw input:checked+.t::after{background:var(--ink-fg)}
.sw input:checked+.t::after{transform:translateX(12px)}
.sw input:focus-visible+.t{box-shadow:0 0 0 3px var(--sel-ring)}
.sw .l{font-weight:500;line-height:1.3}
.sw .d{color:var(--t3);font-size:12px;display:block;font-weight:400}
.segi{display:inline-flex;gap:2px;padding:2px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--rs)}
.segi.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.segi button{height:26px;min-width:28px;padding:0 8px;border-radius:calc(var(--rs) - 3px);display:grid;place-items:center;color:var(--t2);font-size:12px;font-weight:500;transition:background var(--fast),color var(--fast),box-shadow var(--fast)}
.segi button:hover{color:var(--t1)}
.segi button[aria-pressed="true"]{background:var(--panel);color:var(--t1);box-shadow:var(--sh-1)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:12px 1fr 24px;align-items:center;gap:6px;padding:4px 4px 4px 2px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2);transition:border-color var(--fast),box-shadow var(--fast)}
.opt:focus-within{border-color:var(--line-3)}
.opt.dragging{opacity:.4}
.opt .grip{color:var(--t4);cursor:grab;display:grid;place-items:center}
.opt .ctl{height:28px;font-size:13px;background:var(--panel);border-radius:var(--r1)}
.opt .val{grid-column:2;display:flex;align-items:center;gap:6px;padding:0 2px;font-family:var(--mono);font-size:11px;color:var(--t3);cursor:text}
.opt .val input{border:0;background:transparent;outline:0;font:inherit;color:inherit;min-width:0;flex:1;padding:2px 0}
.opt .val input:focus{color:var(--t1)}
.opt .rm{width:24px;height:24px;border-radius:var(--r1);display:grid;place-items:center;color:var(--t3);transition:background var(--fast),color var(--fast)}
.opt .rm:hover{background:var(--err-soft);color:var(--err)}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border:1px dashed var(--line-2);border-radius:var(--rs);color:var(--t2);font-weight:500;transition:border-color var(--fast),color var(--fast),background var(--fast)}
.add-row:hover{border-color:var(--line-3);color:var(--t1);background:var(--panel-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:12px;color:var(--t2);transition:border-color var(--fast),background var(--fast),color var(--fast)}
.chip:hover{border-color:var(--line-3);color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip .sw2{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.map{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2);min-width:0}
.map .mi{width:24px;height:24px;border-radius:var(--r1);background:var(--sel-soft);color:var(--sel);display:grid;place-items:center;flex:none}
.map .mt{flex:1;min-width:0}
.map .mt b{display:block;font-family:var(--mono);font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map .mt span{font-size:11px;color:var(--t3)}
.map button{color:var(--t3);width:24px;height:24px;border-radius:var(--r1);display:grid;place-items:center;flex:none;transition:background var(--fast),color var(--fast)}
.map button:hover{background:var(--ink-soft);color:var(--t1)}
.map button.mt{width:auto;height:auto;display:block;flex:1;text-align:left;color:inherit;padding:2px 4px;margin:-2px -4px}
.map button.mt:hover{background:var(--ink-soft)}
.checklist b .sub2,.checklist li .sub2{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--t3)}
.checklist li.lgrp{background:none;padding:10px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:600}
.checklist li[aria-disabled="true"]{opacity:.5}
.checklist .btn{flex:none}
.checklist .ci.block{background:var(--err)}
.cond{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2)}
.cond .cl{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center}
.cond .cl .w{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.cond .ctl{height:28px;font-size:12px;background:var(--panel);border-radius:var(--r1)}
.cond .ft{display:flex;justify-content:flex-end}
.cond .ft button{color:var(--t3);font-size:12px;padding:2px 4px;border-radius:var(--r0)}
.cond .ft button:hover{color:var(--err)}
.empty{padding:14px 12px;text-align:center;color:var(--t3);border:1px dashed var(--line-2);border-radius:var(--r2);font-size:13px;line-height:1.4}
.empty b{display:block;color:var(--t2);font-weight:600;margin-bottom:1px}
.insp-empty{padding:56px 24px;text-align:center;color:var(--t3)}
.insp-empty .ic{width:40px;height:40px;border-radius:var(--r2);background:var(--panel-3);display:grid;place-items:center;margin:0 auto 12px;color:var(--t3)}
.insp-empty b{display:block;color:var(--t1);font-weight:600;margin-bottom:4px}
.drop{display:flex;align-items:center;gap:10px;padding:8px;border:1px dashed var(--line-2);border-radius:var(--r2);transition:border-color var(--fast),background var(--fast);cursor:pointer;position:relative;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--sel);background:var(--sel-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .di{width:40px;height:40px;border-radius:var(--r2);background:var(--panel-3);display:grid;place-items:center;color:var(--t2);flex:none;overflow:hidden}
.drop .di img{width:100%;height:100%;object-fit:contain}
.drop b{display:block;font-weight:600}
.drop span{color:var(--t3);font-size:12px}
.drop .x{position:relative;z-index:2;margin-left:auto}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.swatch{aspect-ratio:1;border-radius:var(--rs);position:relative;cursor:pointer;transition:transform 80ms;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border:2px solid var(--sel);border-radius:calc(var(--rs) + 3px)}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow .cw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 6px;border:1px solid var(--line-2);border-radius:var(--rs);background:var(--panel);flex:1;position:relative;cursor:pointer;min-width:0}
.colorrow .cw i{width:20px;height:20px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
.colorrow .cw span{font-family:var(--mono);font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.colorrow .cw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fontlist{display:flex;flex-direction:column;gap:4px}
.fontlist button{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);text-align:left;transition:border-color var(--fast),background var(--fast)}
.fontlist button:hover{border-color:var(--line-3)}
.fontlist button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}
.fontlist b{font-weight:500;font-size:14px}
.fontlist span{font-size:11px;color:var(--t3)}
.note{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.note svg{flex:none;margin-top:2px}
.note.ok{color:var(--ok)}.note.ok span{color:var(--t2)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stylecard{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2)}
.stylecard b{flex:1;font-weight:500}
.stylecard span{font-size:11px;color:var(--t3)}

/* ============================================================ Overlays */
.toasts{position:fixed;top:calc(var(--top) + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;background:var(--t1);color:var(--bg);border-radius:var(--r2);box-shadow:var(--sh-3);font-weight:500;animation:tin var(--med) var(--ease);min-width:200px;max-width:360px}
.toast .ti{width:22px;height:22px;border-radius:var(--r1);background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.toast.ok .ti{background:var(--ok);color:#fff}.toast.warn .ti{background:var(--warn);color:#fff}
.toast .tx{flex:1}
.toast .btn{background:rgba(255,255,255,.12);border-color:transparent;color:inherit}
.toast.out{animation:tout 180ms forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-4px)}}
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;animation:fade var(--fast)}
.scrim[data-open="true"]{display:flex}
.scrim[data-open="closing"]{display:flex;pointer-events:none;animation:fadeout 140ms var(--ease) forwards}
.scrim[data-open="closing"]>*{animation:popout 140ms var(--ease) forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes popout{to{opacity:0;transform:translateY(4px) scale(.985)}}
.modal{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--med) var(--ease);display:flex;flex-direction:column;max-height:80vh}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.mh h2{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.palette{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--med) var(--ease)}
.palette .search{margin:8px}
.palette .search input{height:42px;font-size:14px;background:var(--panel)}
.pal-list{max-height:52vh;overflow:auto;padding:0 8px 8px}
.pal-g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:600;padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--rs);text-align:left;transition:background var(--fast)}
.pal-i:hover,.pal-i[aria-selected="true"]{background:var(--ink-soft)}
.pal-i .ico{width:24px;height:24px;border-radius:var(--r1);background:var(--panel-3);display:grid;place-items:center;color:var(--t2);flex:none}
.pal-i .tx{flex:1;min-width:0}
.pal-i .tx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i .tx span{color:var(--t3);font-size:12px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.typecard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);text-align:left;transition:border-color var(--fast),background var(--fast),transform 80ms}
.typecard:hover,.typecard:focus-visible{border-color:var(--line-3);background:var(--panel-2);transform:translateY(-1px)}
.typecard .ico{width:28px;height:28px;border-radius:var(--r1);background:var(--panel-3);display:grid;place-items:center;color:var(--t2)}
.typecard b{font-weight:600;font-size:13px}
.typecard span{color:var(--t3);font-size:12px;line-height:1.35}
.checklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);background:var(--panel-2)}
.checklist li.clk{cursor:pointer;transition:background var(--fast)}.checklist li.clk:hover{background:var(--ink-soft)}
.checklist .ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.checklist .ci.ok{background:var(--ok)}.checklist .ci.warn{background:var(--warn)}.checklist .ci.chg{background:var(--ink-soft-2);color:var(--t2)}
.checklist b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist span{color:var(--t3);font-size:12px;flex:none}
.checklist>li>span:last-of-type{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxmenu{position:fixed;z-index:45;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-3);padding:4px;display:none;animation:pop var(--fast) var(--ease)}
.ctxmenu[data-open="true"]{display:block}
.ctxmenu[data-open="closing"]{display:block;pointer-events:none;animation:popout 120ms var(--ease) forwards}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:var(--r1);text-align:left;font-weight:500;color:var(--t1)}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--ink-soft);outline:0}
.ctxmenu button.danger{color:var(--err)}.ctxmenu button.danger:hover{background:var(--err-soft)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 2px}
.ctxmenu .kbd{margin-left:auto}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.shortcuts div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.shortcuts div span:first-child{color:var(--t2)}

/* ============================================================ Responsive */
@media (max-width:1180px){:root{--left:260px}}
@media (min-width:901px) and (max-width:1180px){
  .app,.app[data-right="closed"]{grid-template-columns:var(--left) 1fr 0}
  .app[data-left="closed"],.app[data-left="closed"][data-right="closed"]{grid-template-columns:0 1fr 0}
  .panel.right{position:fixed;top:var(--top);bottom:0;right:0;width:var(--right);z-index:30;box-shadow:var(--sh-3);transform:translateX(100%);transition:transform var(--med) var(--ease)}
  .app[data-right="open"] .panel.right{transform:none}
  .panel.right .resizer{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr!important}
  .stage{grid-column:1}
  .panel.left,.panel.right{position:fixed;top:var(--top);bottom:0;width:min(86vw,340px);z-index:40;box-shadow:var(--sh-3);transform:translateX(-100%);transition:transform var(--med) var(--ease)}
  .panel.right{right:0;left:auto;transform:translateX(100%)}
  .app[data-left="open"] .panel.left,.app[data-right="open"] .panel.right{transform:none}
  .panel>*:not(.resizer){min-width:0}
  .resizer{display:none}
  .topbar{grid-template-columns:auto 1fr auto;padding:0 6px;gap:4px}
  .topbar .logo{display:none}
  .topbar .sep,.btn .kbd{display:none}
  .name-btn{flex:1;min-width:0;padding:0 6px}
  .name-btn span{max-width:none;flex:1}
  .pill#savePill{width:22px;padding:0;justify-content:center;flex:none}
  .pill#savePill #saveText{display:none}
  .stage-bar{padding:8px 10px;gap:8px}
  .crumb{flex:1}
  .zoom,#themeBtn,#devSeg{display:none}
  .stage-scroll{padding:4px 10px 112px}
  .frame{border-radius:var(--r3)}
  .scr-body{padding:24px 20px;min-height:0}
  .dock{bottom:calc(12px + env(safe-area-inset-bottom));gap:0;padding:4px}
  .drawer-scrim{position:fixed;inset:var(--top) 0 0;background:rgba(0,0,0,.35);z-index:35;display:none;animation:fade var(--fast)}
  .app[data-left="open"] .drawer-scrim,.app[data-right="open"] .drawer-scrim{display:block}
  .ctl,.search input,.inp input,.inp select,.opt .ctl,textarea.ctl{font-size:16px}
  .opt .val input{font-size:12px}
  .scrim{padding:6vh 10px 10px}
  .modal{max-height:88vh}
  .tree-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .insp{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .toasts{left:12px;right:12px;top:calc(var(--top) + 8px);transform:none;align-items:stretch}
  .toast{min-width:0;max-width:none}
  .m-close{display:grid;position:absolute;top:8px;right:8px;z-index:6}
  .m-ph{display:flex}.m-ph+.tabs{margin-top:0}
  .panel.left .ph,.panel.right .ph{padding-right:44px}
}
@media (hover:none){
  .row .more{opacity:1}
  .fw.sel .hd,.fw.sel .fx{opacity:1}
  [data-tip]::after{display:none}
  .choice:hover{border-color:var(--fl2)}
}
@media (max-width:560px){#dockExit{width:32px;padding:0;font-size:0;gap:0}.g2,.g3{grid-template-columns:1fr}.shortcuts{grid-template-columns:1fr}.topbar .seg button{padding:0 10px}.topbar .seg button svg,#publishBtn svg,.name-btn svg{display:none}#publishBtn{padding:0 12px}.typegrid{grid-template-columns:1fr 1fr}}
/* Touch: 40px tree rows, and every small control gets an invisible hit area of at least 40px. */
@media (pointer:coarse){
  .row,.row.fld,.row.sect{height:40px}
  .row .more{width:36px;height:36px}
  .row .caret,.opt .rm,.map button,.ictx .acts button,.fw .fx button{position:relative}
  .row .caret::before,.opt .rm::before,.map button::before{content:"";position:absolute;inset:-10px}
  .ictx .acts button::before,.m-close::before{content:"";position:absolute;inset:-6px}
  .fw .fx button::before{content:"";position:absolute;inset:-12px -2px}
  .tabs button::before{content:"";position:absolute;inset:-9px 0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}
@media print{.topbar,.panel,.dock,.stage-bar{display:none!important}.app{display:block}.stage{background:#fff}}
</style>

const schemaOf = m => SCHEMA_BY[m] || null;
const isCustom = m => /^custom\.[a-z0-9_]+$/.test(m||'');
const mapTitle = m => schemaOf(m)?.label || (isCustom(m) ? m.slice(7).replace(/_/g,' ') : (m||''));
const REQUIRED_PATHS = SCHEMA.filter(x=>x.req).map(x=>x.path);
/* Field types that can store each schema type. */
const COMPAT = { text:['text','textarea','select','choice'], email:['email','text'], phone:['phone','text'], date:['date'], currency:['currency','number'], number:['number','currency','text'], address:['address','text'], yesno:['yesno','choice'], choice:['choice','select'], multi:['multi'], select:['select','choice'] };
const stdOptions = sc => sc.enum.map(([v,l])=>({id:id('o'), label:l, value:v, manual:true}));

const S = (title, fields, x={}) => ({ id:id('s'), title, description:'', fields, conditions:[], open:false, ...x });
const SEC = (title, screens, x={}) => ({ id:id('sec'), title, screens, open:false, ...x });

/* Mapping an existing field adopts what the schema knows, without overwriting what the author already wrote. */
function setMap(f, path){ f.map = path; const sc = schemaOf(path); if(!sc) return; const fresh = !f.label.trim() || f.label==='New question'; if(fresh){ f.label = sc.label; f.type = sc.type; f.required = !!sc.req; } if(f.validation==='none' && sc.validation) f.validation = sc.validation; if(sc.enum && HAS_OPTS(f.type) && (!f.options.length || f.options.every(o=>/^Option \d+$/.test(o.label)))) f.options = stdOptions(sc); if(sc.path==='property.state' && f.type==='select') f.optsrc='states'; }

/* ============================================================
   State, history, persistence
   ============================================================ */
const LS = 'pylon.builder.v3';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, s=14) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${n}"/></svg>`;
const clone = o => JSON.parse(JSON.stringify(o));

let state = load() || seed();
let sel = { kind:'field', id: state.sections[0].screens[0].fields[0]?.id };
const ui = { mode:'edit', device:'desktop', tab:'form', zoom:1, query:'', dirty:false, testIdx:0, answers:{}, codeFmt:'form', errors:{}, persona:'blank' };
const prefs = loadPrefs();
const history = { past:[], future:[], limit:100 };

function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); if(!s?.sections) return null; uid = s._uid || 9000; return s; }catch(e){ return null; } }
function persist(){ try{ state._uid = uid; localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(LS+'.prefs')) || {}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem(LS+'.prefs', JSON.stringify(prefs)); }catch(e){} }

function snapshot(){ history.past.push(JSON.stringify(state)); if(history.past.length>history.limit) history.past.shift(); history.future.length=0; syncHistory(); }
function undo(){ if(!history.past.length) return; history.future.push(JSON.stringify(state)); state = JSON.parse(history.past.pop()); restored('Undone'); }
function redo(){ if(!history.future.length) return; history.past.push(JSON.stringify(state)); state = JSON.parse(history.future.pop()); restored('Redone'); }
function restored(msg){ if(!find(sel)) sel = { kind:'screen', id: allScreens()[0]?.id }; markDirty(); renderAll(); syncHistory(); toast(msg); }
function syncHistory(){ $('#dockUndo').disabled = !history.past.length; $('#dockRedo').disabled = !history.future.length; }
function markDirty(){ ui.dirty = true; const p = $('#savePill'); p.classList.add('dirty'); p.dataset.tip = 'Save draft  ⌘S'; $('#saveText').textContent = 'Unsaved'; }
function markSaved(){ ui.dirty = false; const p = $('#savePill'); p.classList.remove('dirty'); p.dataset.tip = 'Saved to this browser'; $('#saveText').textContent = 'Saved'; }
function commit(fn, o={}){ snapshot(); fn(); markDirty(); if(!o.quiet) renderAll(); }

/* lookups */
function allScreens(){ return state.sections.flatMap(s => s.screens); }
function allFields(){ return allScreens().flatMap(s => s.fields); }
function find(ref){ if(!ref?.id) return null; for(const sec of state.sections){ if(ref.kind==='section' && sec.id===ref.id) return {section:sec}; for(const scr of sec.screens){ if(ref.kind==='screen' && scr.id===ref.id) return {section:sec, screen:scr}; for(const f of scr.fields){ if(ref.kind==='field' && f.id===ref.id) return {section:sec, screen:scr, field:f}; } } } return null; }
function currentScreen(){ const r = find(sel); if(!r) return null; return r.screen || r.section?.screens[0] || null; }
function parentList(ref){ const r = find(ref); if(ref.kind==='section') return state.sections; if(ref.kind==='screen') return r.section.screens; return r.screen.fields; }
function detach(ref){ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); return list.splice(i,1)[0]; }
function reId(o){ if(Array.isArray(o)) return o.forEach(reId); if(o && typeof o==='object'){ if(o.id) o.id = id(o.id.split('_')[0]); Object.values(o).forEach(reId); } }
function fieldOptions(f){ if(f.optsrc==='states') return US_STATES.map(s=>({id:'st_'+slug(s), label:s, value:slug(s)})); return f.options; }
function mapLabel(m){ const f = allFields().find(x=>x.map===m); return f ? f.label : m; }
function exportForm(){ return { name:state.name, brand:state.brand, style:state.style, styles:state.styles, sections:state.sections.map(s=>({ title:s.title, screens:s.screens.map(x=>({ title:x.title, description:x.description, conditions:x.conditions, fields:x.fields.map(f=>({ label:f.label, type:f.type, required:f.required, description:f.description, map:f.map, validation:f.validation, validationMsg:f.validationMsg||undefined, width:f.width, remember:f.remember, optsrc:f.optsrc, options:f.options.map(o=>({label:o.label,value:o.value})), conditions:f.conditions, appearance:f.appearance, styleRef:f.styleRef })) })) })), embed:embedOf() }; }
const EMBED_DEFAULT = { mode:'inline', version:'live', theme:'brand', prefill:true, events:false };
const embedOf = () => state.embed ||= {...EMBED_DEFAULT};
/* Builds the form a JSON document describes without touching the current one, so a preview can diff and check it first. */
function parseForm(j){ if(!Array.isArray(j.sections)) throw new Error('needs a "sections" array'); const next = { embedId:state.embedId, embed:{...EMBED_DEFAULT, ...(j.embed||{})}, name:j.name||state.name, brand:{...state.brand, ...(j.brand||{})}, style:{...state.style, ...(j.style||{})}, styles:j.styles||state.styles||[], sections:j.sections.map(s=>({ id:id('sec'), title:s.title||'Section', open:false, screens:(s.screens||[]).map(x=>({ id:id('s'), title:x.title||'Screen', description:x.description||'', conditions:x.conditions||[], open:false, fields:(x.fields||[]).map(f=>({ id:id('f'), label:f.label||'Question', type:TYPES[f.type]?f.type:'text', required:f.required!==false, description:f.description||'', map:f.map||'', validation:f.validation||'none', validationMsg:f.validationMsg||'', width:f.width||'auto', remember:f.remember!==false, optsrc:f.optsrc, options:(f.options||[]).map(o=>({id:id('o'),label:o.label,value:o.value??slug(o.label)})), conditions:f.conditions||[], appearance:f.appearance, styleRef:f.styleRef })) })) })) }; if(!next.sections.length) throw new Error('at least one section is required'); return next; }
function adoptForm(next){ state = next; state.sections[0].open = true; sel = { kind:'screen', id: state.sections[0].screens[0]?.id }; }

/* ============================================================
   Render: tree
   ============================================================ */
const match = t => !ui.query || t.toLowerCase().includes(ui.query.toLowerCase());
function hl(text){ if(!ui.query) return esc(text); const q = ui.query.toLowerCase(); const i = text.toLowerCase().indexOf(q); if(i<0) return esc(text); return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length)); }
function renderTree(){
  const tree = $('#tree'); let html=''; let nS=0,nF=0; ui.iss = computeIssues(); syncIssues();
  for(const sec of state.sections){
    nS += sec.screens.length; nF += sec.screens.reduce((a,s)=>a+s.fields.length,0);
    const screens = sec.screens.filter(scr => !ui.query || match(sec.title) || match(scr.title) || scr.fields.some(f=>match(f.label)));
    if(ui.query && !screens.length) continue;
    const open = ui.query ? true : !!sec.open;
    html += `<div class="node sect" data-kind="section" data-id="${sec.id}" data-open="${open}" draggable="true">
      <div class="row sect" role="treeitem" aria-selected="${sel.kind==='section'&&sel.id===sec.id}" aria-expanded="${open}" tabindex="0">
        <button class="caret" data-act="toggle" tabindex="-1" aria-label="Toggle">${icon('i-chev')}</button>
        <span class="lbl">${hl(sec.title)}</span><span class="n">${sec.screens.length}</span>
        <button class="more" data-act="menu" tabindex="-1" aria-label="More">${icon('i-more')}</button></div>
      <div class="kids"><div>`;
    for(const scr of screens){
      const fields = scr.fields.filter(f => !ui.query || match(f.label) || match(scr.title) || match(sec.title));
      const sopen = ui.query ? true : !!scr.open;
      const sevs = scr.fields.map(f=>ui.iss.byId[f.id]); const sev = ui.iss.byId[scr.id]==='block' || sevs.includes('block') ? 'block' : ui.iss.byId[scr.id] || sevs.find(Boolean) || '';
      const flag = v => v ? `<span class="flag ${v}" data-tip="${v==='block'?'Fix before publishing':'Worth a look'}" data-tip-pos="left"></span>` : '';
      html += `<div class="node scr" data-kind="screen" data-id="${scr.id}" data-open="${sopen}" draggable="true">
        <div class="row scr" role="treeitem" aria-selected="${sel.kind==='screen'&&sel.id===scr.id}" aria-expanded="${sopen}" tabindex="0">
          <button class="caret" data-act="toggle" tabindex="-1" aria-label="Toggle">${icon('i-chev')}</button>
          <span class="ico">${icon('i-screen')}</span><span class="lbl">${hl(scr.title)}</span>
          ${flag(sev)}${scr.conditions?.length?`<span class="ico" data-tip="Conditional" data-tip-pos="left">${icon('i-branch')}</span>`:''}
          <button class="more" data-act="menu" tabindex="-1" aria-label="More">${icon('i-more')}</button></div>
        <div class="kids"><div>`;
      for(const f of fields){
        html += `<div class="node fld" data-kind="field" data-id="${f.id}" draggable="true">
          <div class="row fld" role="treeitem" aria-selected="${sel.kind==='field'&&sel.id===f.id}" tabindex="0">
            <span class="caret-sp" aria-hidden="true"></span><span class="ico" data-tip="${TYPES[f.type].label}" data-tip-pos="left">${icon(TYPES[f.type].icon)}</span>
            <span class="lbl">${hl(f.label)}</span>${flag(ui.iss.byId[f.id])}${f.conditions?.length?`<span class="ico" data-tip="Conditional" data-tip-pos="left">${icon('i-branch')}</span>`:''}
            <button class="more" data-act="menu" tabindex="-1" aria-label="More">${icon('i-more')}</button></div></div>`;
      }
      html += `</div></div></div>`;
    }
    html += `</div></div></div>`;
  }
  tree.innerHTML = html || `<div class="tree-empty"><b>No matches</b>Try a different word.</div>`;
  $('#treeStats').textContent = `${nS} screens · ${nF} fields`;
  if(!ui._noScroll) tree.querySelector('.row[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
}

/* ============================================================
   Render: canvas
   ============================================================ */
function passes(conds, answers=ui.answers){ if(!conds?.length) return true; return conds.every(c => { const src = allFields().find(x=>x.map===c.field); const v = src ? answers[src.id] : undefined; const has = Array.isArray(v) ? v.length>0 : (v!=null && v!==''); if(c.op==='equals') return Array.isArray(v) ? v.includes(c.value) : v===c.value; if(c.op==='not_equals') return Array.isArray(v) ? !v.includes(c.value) : v!==c.value; if(c.op==='answered') return has; if(c.op==='empty') return !has; return true; }); }
/* A screen whose every field is hidden is skipped, as a borrower would never see it; a screen with no fields at all still shows. */
function testScreens(){ return allScreens().filter(s => passes(s.conditions) && (!s.fields.length || s.fields.some(f => passes(f.conditions)))); }
function appStyle(t){ const a = t?.appearance||{}; const st = t?.styleRef ? state.styles.find(s=>s.id===t.styleRef)?.appearance||{} : {}; const m = {...st, ...a}; const css=[]; if(m.font && m.font!=='inherit') css.push(`font-family:${FONTS[m.font]?.css||'inherit'}`); if(m.weight&&m.weight!=='inherit') css.push(`font-weight:${m.weight}`); if(m.size) css.push(`font-size:${m.size}px`); if(m.align&&m.align!=='inherit') css.push(`text-align:${m.align}`); if(m.cText) css.push(`color:${m.cText}`); if(m.radius) css.push(`--field-radius:${m.radius}px`); return css.join(';'); }
function preview(f){
  const err = ui.errors[f.id];
  switch(f.type){
    case 'choice': case 'multi': {
      const list = fieldOptions(f); if(!list.length) return `<div class="empty" style="border-color:var(--fl2);color:var(--ft3)">No options yet — add some in the inspector.</div>`;
      const ed = ui.mode==='edit' && !f.optsrc && sel.kind==='field' && sel.id===f.id ? 'contenteditable="true" spellcheck="false"' : '';
      return `<div class="choices">${list.map((o,i)=>{ const on = ui.mode==='test' ? (f.type==='multi' ? (ui.answers[f.id]||[]).includes(o.value) : ui.answers[f.id]===o.value) : (i===0 && f.type==='choice'); const ic = f.icons?.[i] ? `<span class="ci">${icon(f.icons[i],18)}</span>` : ''; return `<div class="choice ${f.type==='multi'?'multi':''} ${on?'on':''}" data-opt="${esc(o.value)}" data-fid="${f.id}" role="${f.type==='multi'?'checkbox':'radio'}" aria-checked="${on}" tabindex="0">${ic}<span class="ct ce" data-edit="opt" data-oid="${o.id}" data-ph="Option" ${ed}>${esc(o.label)}</span><span class="ck">${icon('i-check',12)}</span></div>`; }).join('')}</div>`;
    }
    case 'yesno': { const v = ui.mode==='test' ? ui.answers[f.id] : 'yes'; return `<div class="yesno"><div class="choice ${v==='yes'?'on':''}" data-opt="yes" data-fid="${f.id}" role="radio" aria-checked="${v==='yes'}" tabindex="0"><span class="ct">Yes</span></div><div class="choice ${v==='no'?'on':''}" data-opt="no" data-fid="${f.id}" role="radio" aria-checked="${v==='no'}" tabindex="0"><span class="ct">No</span></div></div>`; }
    case 'select': { const list = fieldOptions(f); if(ui.mode==='test') return `<div class="inp" style="padding:0"><select data-fid="${f.id}" style="flex:1;height:100%;border:0;background:transparent;padding:0 14px;color:var(--ft1);font:inherit;outline:0;appearance:none"><option value="">Select…</option>${list.map(o=>`<option value="${esc(o.value)}" ${ui.answers[f.id]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>${icon('i-chev',14)}<span style="width:14px"></span></div>`; return `<div class="inp" style="justify-content:space-between"><span>${list.length?`Select… <span style="font-size:12px">(${list.length})</span>`:'Select…'}</span>${icon('i-chev',14)}</div>`; }
    case 'currency': return `<div class="inp"><span class="pre">$</span><input placeholder="0" inputmode="decimal" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'number': return `<div class="inp"><input placeholder="0" inputmode="numeric" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'date': return `<div class="inp">${icon('i-date',16)}<input placeholder="MM / DD / YYYY" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'address': return `<div class="inp">${icon('i-address',16)}<input placeholder="Start typing an address" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'email': return `<div class="inp">${icon('i-email',16)}<input placeholder="you@example.com" type="email" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'phone': return `<div class="inp">${icon('i-phone',16)}<input placeholder="(555) 555-0123" type="tel" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    case 'textarea': return `<div class="inp ta"><input placeholder="Type your answer" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
    default: return `<div class="inp"><input placeholder="Type your answer" data-fid="${f.id}" value="${esc(ui.answers[f.id]||'')}"></div>`;
  }
}
function renderCanvas(o={}){
  const screens = ui.mode==='test' ? testScreens() : allScreens();
  if(ui.mode==='test' && ui.testIdx >= screens.length) ui.testIdx = Math.max(0, screens.length-1);
  const scr = ui.mode==='test' ? screens[ui.testIdx] : currentScreen();
  const r = scr ? find({kind:'screen', id:scr.id}) : null;
  const idx = scr ? screens.indexOf(scr) : -1;
  const st = state.style; const fr = $('#frame');
  fr.dataset.scheme = st.scheme==='dark' ? 'dark' : 'light';
  fr.style.setProperty('--frame-font', FONTS[st.font]?.css || FONTS.inter.css);
  fr.style.setProperty('--title-size', (st.titleSize||24)+'px'); fr.style.setProperty('--title-weight', st.titleWeight||600); fr.style.setProperty('--field-radius', (st.radius||12)+'px');
  fitZoom();
  $('#frameSteps').textContent = scr ? `${String(idx+1).padStart(2,'0')} / ${String(screens.length).padStart(2,'0')}` : '';
  $('#progressBar').style.width = scr ? `${((idx+1)/screens.length)*100}%` : '0';
  $('#frameBrand').textContent = state.brand.name || 'Pylon';
  const logo = (st.scheme==='dark' && state.brand.logoDark) || state.brand.logo;

/* ============================================================
   Issues. Every check names the thing to fix and, where one exists, the fix itself.
   Blockers stop publishing; warnings don't. Recomputed on every render.
   ============================================================ */
function rulesDependingOn(paths, excludeIds=[]){ const P = new Set(paths.filter(Boolean)); if(!P.size) return []; const out = []; for(const scr of allScreens()){ if(!excludeIds.includes(scr.id) && (scr.conditions||[]).some(c=>P.has(c.field))) out.push({o:scr, kind:'screen'}); for(const f of scr.fields) if(!excludeIds.includes(f.id) && (f.conditions||[]).some(c=>P.has(c.field))) out.push({o:f, kind:'field'}); } return out; }
function lum(hex){ const h = hex.replace('#',''); const [r,g,b] = [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return 0.2126*r+0.7152*g+0.0722*b; }
function computeIssues(){
  const fields = allFields(), screens = allScreens(); const issues = []; const by = {}; fields.forEach(f=>{ if(f.map) (by[f.map] ||= []).push(f); });
  const order = new Map(); screens.forEach((s,si)=>{ order.set(s.id, si*1000); s.fields.forEach((f,fi)=>order.set(f.id, si*1000+fi+1)); });
  const add = (sev, l, s, go, fix) => issues.push({sev, l, s, go, fix});
  const gf = (f, focus) => ({kind:'field', id:f.id, focus}); const gs = x => ({kind:'screen', id:x.id});
  if(!screens.length) add('block', 'The form has no screens', 'Add a section and a screen', null, {t:'addscreen'});
  else if(!fields.length) add('block', 'The form has no questions', '', gs(screens[0]));
  for(const p of REQUIRED_PATHS) if(!by[p]) add('block', `Doesn't collect ${schemaOf(p).label.toLowerCase()}`, 'Needed for every loan', null, {t:'add', path:p});
  for(const f of fields){ const sc = schemaOf(f.map); const tl = TYPES[f.type].label.toLowerCase();
    if(!f.label.trim() || f.label==='New question') add('block', 'A question has no label', f.map ? mapTitle(f.map) : tl, gf(f,'label'));
    if(!f.map) add('warn', `“${f.label}” isn't saved anywhere`, 'Choose loan data or make it a custom field', gf(f), {t:'map', id:f.id});
    else if(!sc && !isCustom(f.map)) add('warn', `“${f.label}” saves to an unknown path`, f.map, gf(f), {t:'map', id:f.id});
    if(sc && !(COMPAT[sc.type]||[sc.type]).includes(f.type)) add('block', `“${f.label}” is ${an(tl)}, but ${sc.label.toLowerCase()} needs ${an(TYPES[sc.type].label.toLowerCase())}`, '', gf(f), {t:'type', id:f.id, type:sc.type});
    if(HAS_OPTS(f.type) && !f.optsrc){
      if(f.options.length<2 || f.options.some(o=>!o.label.trim())) add('block', `“${f.label}” needs two or more complete options`, '', gf(f));
      if(new Set(f.options.map(o=>o.value)).size!==f.options.length) add('block', `“${f.label}” has duplicate option values`, '', gf(f));
      if(sc?.enum){ const ok = new Set(sc.enum.map(e=>e[0])); const bad = f.options.filter(o=>!ok.has(o.value)); if(bad.length) add('block', `“${f.label}” has values ${sc.label.toLowerCase()} won't accept`, bad.map(o=>o.value).join(', '), gf(f), {t:'stdopts', id:f.id}); }
    }
    if(f.label.length>90) add('warn', `“${f.label.slice(0,40)}…” is a long label`, `${f.label.length} characters`, gf(f,'label'));
  }
  for(const a of Object.values(by).filter(a=>a.length>1)) add('block', `Two questions save to ${mapTitle(a[0].map).toLowerCase()}`, a.map(f=>f.label).join(' · '), gf(a[1]), {t:'map', id:a[1].id});
  const owners = [...screens.map(o=>({o,kind:'screen'})), ...fields.map(o=>({o,kind:'field'}))];
  for(const {o,kind} of owners) for(const c of o.conditions||[]){ const src = by[c.field]?.[0]; const name = kind==='field' ? o.label : o.title; const go = kind==='field' ? gf(o) : gs(o);
    if(!src || src.id===o.id){ add('block', `A rule on “${name}” points at nothing`, c.field || 'No question chosen', go); continue; }
    if(['equals','not_equals'].includes(c.op) && !c.value) add('block', `A rule on “${name}” has no value`, '', go);
    else if(c.value && HAS_OPTS(src.type) && !fieldOptions(src).some(x=>x.value===c.value)) add('block', `A rule on “${name}” uses an option that no longer exists`, c.value, go);
    const sp = order.get(src.id), op = kind==='screen' ? order.get(o.id)+1 : order.get(o.id); if(sp>=op) add('block', `A rule on “${name}” depends on a later answer`, `“${src.label}” is asked afterwards`, go);
  }
  for(const p of PERSONAS.filter(x=>x.k!=='blank')){ const A = {}; for(const [m,v] of Object.entries(p.a)){ const f = by[m]?.[0]; if(f) A[f.id]=v; } const seen = new Set(); for(const scr of screens){ if(!passes(scr.conditions, A)) continue; for(const f of scr.fields) if(f.map && passes(f.conditions, A)) seen.add(f.map); } for(const rp of REQUIRED_PATHS) if(by[rp] && !seen.has(rp)) add('block', `${schemaOf(rp).label} is hidden on the ${p.l.toLowerCase()} path`, 'A rule hides it for this borrower', gf(by[rp][0])); }
  for(const scr of screens) if(!scr.fields.length) add('warn', `“${scr.title}” is an empty screen`, 'Borrowers see a blank step', gs(scr));
  const brand = state.brand.color==='custom' ? state.brand.custom : BRAND[state.brand.color]||BRAND.ink; const bl = lum(brand), fl = contrast(brand)==='#ffffff' ? 1 : 0; const ratio = (Math.max(bl,fl)+.05)/(Math.min(bl,fl)+.05); if(ratio<4.5) add('warn', 'Brand color is hard to read on buttons', `${ratio.toFixed(1)}:1, needs 4.5:1`, null, {t:'brand'});
  issues.sort((a,b)=>(a.sev==='block'?0:1)-(b.sev==='block'?0:1));
  const byId = {}; for(const i of issues){ const k = i.go?.id; if(k && (!byId[k] || i.sev==='block')) byId[k] = i.sev; }
  return { issues, byId, blockers: issues.filter(i=>i.sev==='block').length, warnings: issues.filter(i=>i.sev==='warn').length };
}
function syncIssues(){ const c = $('#pubCount'); c.hidden = !ui.iss.blockers; c.textContent = ui.iss.blockers; $('#publishBtn').dataset.tip = ui.iss.blockers ? `${ui.iss.blockers} to fix before publishing` : ''; }
const an = w => (/^[aeiou]/.test(w) ? 'an ' : 'a ') + w;
function fixLabel(x){ return {add:'Add', map:'Choose', type:`Make it ${an(TYPES[x.type]?.label.toLowerCase())}`, stdopts:'Use standard options', addscreen:'Add screen', brand:'Open brand'}[x.t]; }
function addFromSchema(path){ const sc = schemaOf(path); const screen = currentScreen() || allScreens().slice(-1)[0]; if(!sc || !screen) return; commit(()=>{ const f = fieldFromSchema(sc); screen.open = true; screen.fields.push(f); sel = {kind:'field', id:f.id}; }); toast(`Added “${sc.label}”`, 'ok'); }
function applyFix(x){ const f = x.id ? find({kind:'field', id:x.id})?.field : null;
  if(x.t==='add') return addFromSchema(x.path);
  if(x.t==='addscreen') return addScreen();
  if(x.t==='brand'){ ui.tab='brand'; renderInspector(); return; }
  if(!f) return;
  if(x.t==='map'){ select({kind:'field', id:f.id}); openMapPicker(f); }
  if(x.t==='type'){ const sc = schemaOf(f.map); commit(()=>{ f.type = x.type; if(sc?.enum && HAS_OPTS(f.type)) f.options = stdOptions(sc); }); select({kind:'field', id:f.id}); }
  if(x.t==='stdopts'){ const sc = schemaOf(f.map); commit(()=>{ f.options = stdOptions(sc); }); select({kind:'field', id:f.id}); }
}

/* ============================================================
   Interactions: selection, tree
   ============================================================ */
const narrow = ()=>innerWidth<=900;
const layout = ()=> innerWidth<=900 ? 'phone' : innerWidth<=1180 ? 'tablet' : 'desk';
const overlayRight = ()=> layout()!=='desk';
function select(ref, o={}){ sel = ref; if(narrow()){ $('#app').dataset.left='closed'; if(o.inspect) $('#app').dataset.right='open'; else if(!o.keepRight) $('#app').dataset.right='closed'; } else if(o.inspect && layout()==='tablet') $('#app').dataset.right='open'; if(ui.mode==='test') setMode('edit', {silent:true}); const r = find(ref); if(r?.section && ref.kind!=='section') r.section.open = true; if(r?.screen && ref.kind==='field') r.screen.open = true; ui.tab='form'; ui._noScroll = !!o.noScroll; ui.selAnim = ref.id; renderAll(); ui._noScroll=false; ui.selAnim = null; const ins = $('#insp'); ins.classList.remove('fade'); void ins.offsetWidth; ins.classList.add('fade'); if(o.focus) setTimeout(()=>{ if(o.focus==='map'){ const f = find(sel)?.field; if(f) openMapPicker(f); return; } const el = $(`#insp [data-bind="${o.focus}"]`); el?.focus(); el?.select?.(); }, 40); }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if(g && !e.target.closest('.ctxmenu')){ select({kind:g.dataset.go, id:g.dataset.id}); } });

const tree = $('#tree');
tree.addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); const node = e.target.closest('.node'); if(!node) return;
  const ref = {kind:node.dataset.kind, id:node.dataset.id};
  if(act?.dataset.act==='toggle'){ e.stopPropagation(); const r = find(ref); const obj = r.screen || r.section; obj.open = node.dataset.open!=='true'; node.dataset.open = obj.open; node.querySelector('.row').setAttribute('aria-expanded', obj.open); persist(); return; }
  if(act?.dataset.act==='menu'){ e.stopPropagation(); openMenu(e, ref, act); return; }
  if(ui.mode==='edit' && sel.kind===ref.kind && sel.id===ref.id && ref.kind!=='field' && !narrow()){ node.querySelector('[data-act=toggle]').click(); return; }
