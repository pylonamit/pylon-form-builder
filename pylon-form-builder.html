  scrim.innerHTML = `<div class="palette" role="dialog" aria-modal="true"><div class="search"><svg width="16" height="16"><use href="#i-search"/></svg><input id="palIn" placeholder="Search commands, screens and fields" autocomplete="off"></div><div class="pal-list scroll" id="palList"></div></div>`;
  scrim.dataset.open='true'; const inp = $('#palIn'); let cur=0, vis=[];
  const draw = ()=>{ const q = inp.value.trim().toLowerCase(); vis = cmds.filter(c=>!q || c.l.toLowerCase().includes(q) || c.sub?.includes(q) || c.g.toLowerCase().includes(q)).slice(0,60); cur = Math.min(cur, Math.max(0,vis.length-1)); let g=''; $('#palList').innerHTML = vis.map((c,i)=>{ const h = c.g!==g ? `<div class="pal-g">${c.g}</div>` : ''; g=c.g; return h+`<button class="pal-i" aria-selected="${i===cur}" data-i="${i}"><span class="ico">${icon(c.i,13)}</span><span class="tx"><b>${esc(c.l)}</b>${c.sub?`<span>${esc(c.sub)}</span>`:''}</span>${c.k?`<span class="kbd">${c.k}</span>`:''}</button>`; }).join('') || `<div class="tree-empty"><b>No matches</b></div>`; $('#palList [aria-selected=true]')?.scrollIntoView({block:'nearest'}); };
  inp.oninput = ()=>{ cur=0; draw(); }; inp.onkeydown = e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); cur=Math.min(vis.length-1,cur+1); draw(); } else if(e.key==='ArrowUp'){ e.preventDefault(); cur=Math.max(0,cur-1); draw(); } else if(e.key==='Enter'){ e.preventDefault(); const c=vis[cur]; if(c){ closeModal(); c.fn(); } } };
  $('#palList').onclick = e=>{ const b=e.target.closest('[data-i]'); if(!b) return; const c=vis[+b.dataset.i]; closeModal(); c.fn(); };
  draw(); inp.focus();
}
function openShortcuts(){ const rows = [['⌘K','Commands'],['/','Search questions'],['⌘S','Save draft'],['⌘Z · ⇧⌘Z','Undo · redo'],['⌘D','Duplicate selection'],['⌫','Delete selection'],['F2 · ⏎','Rename'],['⌥↑ ⌥↓','Move selection'],['⌥← ⌥→','Previous · next screen'],['P','Edit ↔ Test'],['M','Phone ↔ desktop'],['⌘\\ · ⌘/','Toggle panels'],['⌘ scroll','Zoom canvas'],['Esc','Close · back to Edit']]; modal(`<div class="mh"><h2>Keyboard shortcuts</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><div class="shortcuts">${rows.map(([k,l])=>`<div><span>${l}</span><span class="kbd">${k}</span></div>`).join('')}</div></div>`); }

/* ============================================================
   Save / publish / JSON / library / forms
   ============================================================ */
function saveDraft(){ persist(); markSaved(); toast('Draft saved','ok'); }
function openPublish(){
  const fields = allFields(); const unmapped = fields.filter(f=>!f.map); const emptyScreens = allScreens().filter(s=>!s.fields.length); const badOpts = fields.filter(f=>HAS_OPTS(f.type) && !f.optsrc && (f.options.length<2 || f.options.some(o=>!o.label.trim()))); const blank = fields.filter(f=>!f.label.trim()||f.label==='New question');
  const checks = [
    {ok:!blank.length, l:'Every field has a real label', s: blank.length?`${blank.length} to name`:'OK', go: blank[0]},
    {ok:!unmapped.length, l:'Every field is saved to the loan file', s: unmapped.length?`${unmapped.length} unsaved`:'OK', go: unmapped[0]},
    {ok:!emptyScreens.length, l:'No empty screens', s: emptyScreens.length?`${emptyScreens.length} empty`:'OK', goS: emptyScreens[0]},
    {ok:!badOpts.length, l:'Choice fields have 2+ complete options', s: badOpts.length?`${badOpts.length} to fix`:'OK', go: badOpts[0]},
    {ok:true, l:'Brand color passes contrast on buttons', s:'OK'},
  ];
  const ready = checks.every(c=>c.ok);
  modal(`<div class="mh"><h2>Review &amp; publish</h2><span class="pill mono">rev 5361ace</span><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="mb"><p style="margin:0;color:var(--t2)">Goes live for new borrowers. Applications already in progress keep their current version.</p>
      <ul class="checklist">${checks.map((c,i)=>`<li class="${c.ok?'':'clk'}" data-chk="${i}"><span class="ci ${c.ok?'ok':'warn'}">${icon(c.ok?'i-check':'i-warn',11)}</span><b>${c.l}</b><span>${c.s}</span></li>`).join('')}</ul>
      <div class="f"><label>Release note</label><input class="ctl" id="relNote" placeholder="What changed? Optional"></div></div>
    <div class="mf"><button class="btn" data-close>Not yet</button><button class="btn primary" id="doPublish">${ready?'Publish':'Publish anyway'}</button></div>`,
    m => { m.addEventListener('click', e=>{ const li = e.target.closest('li.clk'); if(!li) return; const c = checks[+li.dataset.chk]; closeModal(); if(c.go) select({kind:'field',id:c.go.id},{focus: c===checks[0]?'label':c===checks[1]?'map':undefined}); else if(c.goS) select({kind:'screen',id:c.goS.id}); }); $('#doPublish', m).onclick = ()=>{ closeModal(); persist(); markSaved(); toast('Published — live for new borrowers','ok'); }; });
}
function openJson(){
  modal(`<div class="mh"><h2>Form JSON</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="mb"><textarea class="ctl code" id="jsonBox" style="min-height:48vh" spellcheck="false">${esc(JSON.stringify(exportForm(),null,2))}</textarea><div class="note">${icon('i-info',12)}<span>Applying replaces the whole form. Undo works afterwards.</span></div></div>
    <div class="mf"><button class="btn" data-act="fmt">Format</button><span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="applyJson">Apply</button></div>`,
    m => { $('[data-act=fmt]',m).onclick=()=>{ try{ $('#jsonBox').value = JSON.stringify(JSON.parse($('#jsonBox').value),null,2); }catch(err){ toast('Invalid JSON — '+err.message,'warn'); } }; $('#applyJson', m).onclick = ()=>{ try{ const j = JSON.parse($('#jsonBox').value); commit(()=>importForm(j)); applyBrand(); $('#formName').textContent=state.name; closeModal(); toast('Form updated','ok'); }catch(err){ toast('Invalid JSON — '+err.message,'warn'); } }; });
}
const LIBRARY = [['Co-borrower email','email','coborrower.email'],['Preferred language','select','borrower.language',['English','Spanish','Mandarin','Vietnamese']],['How did you hear about us?','choice','marketing.source',['Referral','Search','Social','Other']],['Down payment amount','currency','loan.down_payment'],['Estimated credit score','select','credit.self_reported',['760+','720–759','680–719','640–679','Below 640']],['Rate lock preference','choice','loan.rate_lock',['Lock now','Float','Not sure']],['Mailing address','address','borrower.mailing.street'],['Best time to call','select','borrower.contact_window',['Morning','Afternoon','Evening']]];
function openLibrary(){ const scr = currentScreen(); if(!scr) return toast('Pick a screen first','warn');
  modal(`<div class="mh"><h2>Question library</h2><span class="pill">Adds to “${esc(scr.title)}”</span><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><div class="search" style="margin:0"><svg width="14" height="14"><use href="#i-search"/></svg><input id="libQ" placeholder="Search library" autocomplete="off"></div><ul class="checklist" id="libList">${LIBRARY.map(([l,t,m],i)=>`<li class="clk" data-lib="${i}"><span class="ico" style="color:var(--t3)">${icon(TYPES[t].icon)}</span><b>${l}</b><span>${TYPES[t].label}</span></li>`).join('')}</ul></div>`,
  m => { const q=$('#libQ',m); q.oninput=()=>$$('li',m).forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(q.value.toLowerCase())); m.addEventListener('click', e=>{ const li=e.target.closest('[data-lib]'); if(!li) return; const [l,t,map,o]=LIBRARY[+li.dataset.lib]; closeModal(); commit(()=>{ const f=F(l,t,{map}); if(o) f.options=opts(...o); scr.open=true; scr.fields.push(f); sel={kind:'field',id:f.id}; }); toast(`Added “${l}”`,'ok'); }); q.focus(); }); }
$('#dockLibrary').onclick = openLibrary;
$('#dockOpen').onclick = ()=>{ const forms=[['Loan application','5361ace','Live · edited today',true],['Loan application (Spanish)','a91c0f2','Draft · 3 days ago'],['HELOC intake','77be104','Draft · last week']]; modal(`<div class="mh"><h2>Saved forms</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><ul class="checklist">${forms.map(([n,r,s,cur])=>`<li class="clk"><span class="ico" style="color:var(--t3)">${icon('i-form')}</span><b>${n}</b><span class="pill mono" style="margin-right:6px">${r}</span><span>${cur?'Open now':s}</span></li>`).join('')}</ul><div class="note">${icon('i-info',12)}<span>Only this form is stored in the prototype.</span></div></div>`, m=>m.addEventListener('click',e=>{ if(e.target.closest('li')){ closeModal(); toast('Only this form is available in the prototype'); } })); };
$('#dockNew').onclick = ()=>{ modal(`<div class="mh"><h2>New form</h2><button class="btn ghost icon sm" data-close aria-label="Close">${icon('i-x')}</button></div><div class="mb"><div class="f"><label>Name</label><input class="ctl" id="newName" placeholder="e.g. HELOC intake"></div><div class="f"><label>Start from</label>${selectHtml('tpl','blank',[['blank','Blank'],['copy','Copy of this form'],['sample','Sample loan application']])}</div></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="mkForm">Create</button></div>`, m=>{ const go=()=>{ const n=$('#newName').value.trim()||'Untitled form'; const tpl=$('[data-bind=tpl]',m).value; closeModal(); commit(()=>{ if(tpl==='blank'){ state={name:n, brand:clone(state.brand), style:clone(state.style), styles:[], sections:[SEC('Getting started',[S('Welcome',[])],{open:true})]}; } else if(tpl==='sample'){ state=seed(); state.name=n; } else { state=clone(state); state.name=n; } sel={kind:'screen',id:state.sections[0].screens[0].id}; }); $('#formName').textContent=state.name; applyBrand(); toast(`Created “${n}”`,'ok'); }; $('#mkForm',m).onclick=go; $('#newName').onkeydown=e=>{ if(e.key==='Enter') go(); }; }); };
$('#dockJson').onclick = openJson; $('#dockCmd').onclick = openPalette; $('#dockKeys').onclick = openShortcuts;
$('#dockUndo').onclick = undo; $('#dockRedo').onclick = redo;
$('#saveBtn').onclick = saveDraft; $('#publishBtn').onclick = openPublish;
$('#dockClose').onclick = ()=>{ if(ui.dirty) modal(`<div class="mh"><h2>Save before closing?</h2></div><div class="mb"><p style="margin:0;color:var(--t2)">Your draft has unsaved changes.</p></div><div class="mf"><button class="btn" data-close>Keep editing</button><button class="btn danger" id="discard">Discard</button><button class="btn primary" id="saveClose">Save &amp; close</button></div>`, m=>{ $('#discard',m).onclick=()=>{ closeModal(); markSaved(); toast('Changes discarded'); }; $('#saveClose',m).onclick=()=>{ saveDraft(); closeModal(); }; }); else toast('Nothing to close in the prototype'); };

/* search */
$('#treeSearch').addEventListener('input', e => { ui.query = e.target.value.trim(); renderTree(); });
$('#treeSearch').addEventListener('keydown', e => { if(e.key==='Escape'){ e.target.value=''; ui.query=''; renderTree(); e.target.blur(); } if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); $('#tree .row')?.focus(); } });

/* global shortcuts */
document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable; const mod = e.metaKey || e.ctrlKey; const k = e.key;
  if(mod && k.toLowerCase()==='k'){ e.preventDefault(); return scrim.dataset.open==='true' ? closeModal() : openPalette(); }
  if(mod && k.toLowerCase()==='s'){ e.preventDefault(); return saveDraft(); }
  if(mod && k==='\\'){ e.preventDefault(); return togglePanel('left'); }
  if(mod && k==='/'){ e.preventDefault(); return togglePanel('right'); }
  if(mod && k.toLowerCase()==='z' && !(inField && !e.target.classList.contains('scr-title'))){ e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if(k==='Escape'){ if(scrim.dataset.open==='true') return closeModal(); if(menu.dataset.open==='true') return closeMenu(); if(ui.mode==='test') return setMode('edit'); if(innerWidth<=900){ $('#app').dataset.left='closed'; $('#app').dataset.right='closed'; } return; }
  if(inField || scrim.dataset.open==='true') return;
  if(mod && k.toLowerCase()==='d'){ e.preventDefault(); return duplicateRef(sel); }
  if(k==='/'){ e.preventDefault(); $('#treeSearch').focus(); }
  if(k==='?'){ e.preventDefault(); openShortcuts(); }
  if(k.toLowerCase()==='p' && !mod){ setMode(ui.mode==='edit'?'test':'edit'); }
  if(k.toLowerCase()==='m' && !mod){ setDevice(ui.device==='mobile'?'desktop':'mobile'); }
  if((k==='Delete' || (k==='Backspace' && mod)) && !e.target.closest('.tree')){ e.preventDefault(); deleteRef(sel); }
  if(e.altKey && (k==='ArrowRight'||k==='ArrowLeft')){ e.preventDefault(); const scr = allScreens(); const i = scr.indexOf(currentScreen()); const n = scr[i + (k==='ArrowRight'?1:-1)]; if(n) select({kind:'screen',id:n.id}); }
  if(e.altKey && (k==='ArrowUp'||k==='ArrowDown') && !e.target.closest('.tree')){ e.preventDefault(); moveRef(sel, k==='ArrowUp'?-1:1); }
});
addEventListener('beforeunload', e => { if(ui.dirty){ persist(); } });

/* boot */
(function boot(){
  if(prefs.theme) setTheme(prefs.theme); else $('#themeBtn').innerHTML = icon(matchMedia('(prefers-color-scheme: dark)').matches?'i-sun':'i-moon',15);
  if(prefs.leftW) document.documentElement.style.setProperty('--left', prefs.leftW+'px'); if(prefs.rightW) document.documentElement.style.setProperty('--right', prefs.rightW+'px');
  if(prefs.leftOpen===false) $('#app').dataset.left='closed'; if(prefs.rightOpen===false) $('#app').dataset.right='closed';
  if(innerWidth<=900){ $('#app').dataset.left='closed'; $('#app').dataset.right='closed'; }
  $('#formName').textContent = state.name; applyBrand(); renderAll(); syncHistory(); markSaved();
  setDevice(prefs.device || (innerWidth<700?'mobile':'desktop')); requestAnimationFrame(()=>{ segThumb($('#modeSeg')); segThumb($('#devSeg')); });
  document.fonts?.ready.then(()=>{ segThumb($('#modeSeg')); segThumb($('#devSeg')); });
})();
</script>
