<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pylon Form Builder</title>
<meta name="description" content="A single-file form builder for Pylon intake: structure, live canvas with test mode, and a focused inspector. Resizable panes, brand and type controls, keyboard-first." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Tokens. One neutral ramp, one accent (selection only), brand
   color is borrower-facing and lives inside the preview frame.
   ============================================================ */
:root{
  --bg:#f4f4f3; --panel:#ffffff; --panel-2:#f8f8f7; --panel-3:#efefed; --canvas:#eeeeec;
  --line:#e6e5e2; --line-2:#d8d6d2; --line-3:#b9b6b0;
  --t1:#18181a; --t2:#5c5b57; --t3:#8d8b85; --t4:#b9b6b0;
  --ink:#18181a; --ink-fg:#ffffff; --ink-soft:rgba(24,24,26,.06); --ink-soft-2:rgba(24,24,26,.1);
  --sel:#2f6df6; --sel-fg:#ffffff; --sel-soft:rgba(47,109,246,.09); --sel-ring:rgba(47,109,246,.3);
  --ok:#1a9d55; --warn:#d58a12; --err:#d93838; --err-soft:rgba(217,56,56,.08);
  --sh-1:0 1px 2px rgba(20,20,22,.06); --sh-2:0 6px 20px rgba(20,20,22,.08),0 1px 2px rgba(20,20,22,.05);
  --sh-3:0 20px 50px rgba(20,20,22,.16),0 2px 6px rgba(20,20,22,.08);
  --r1:6px; --r2:10px; --r3:14px; --r4:20px;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --left:292px; --right:340px; --top:52px;
  --ease:cubic-bezier(.2,.8,.2,1); --fast:140ms; --med:220ms; --slow:360ms;
  --brand:#18181a; --brand-fg:#ffffff;
  --frame-font:var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111112; --panel:#19191b; --panel-2:#151517; --panel-3:#202023; --canvas:#111112;
  --line:#27272a; --line-2:#323236; --line-3:#4b4b50;
  --t1:#f2f2f0; --t2:#b3b2ad; --t3:#7b7a76; --t4:#4e4e52;
  --ink:#f2f2f0; --ink-fg:#111112; --ink-soft:rgba(242,242,240,.07); --ink-soft-2:rgba(242,242,240,.12);
  --sel:#5b8cff; --sel-soft:rgba(91,140,255,.12); --sel-ring:rgba(91,140,255,.35);
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 6px 20px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); --sh-3:0 20px 50px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5);
  --brand:#f2f2f0; --brand-fg:#111112;
}}
:root[data-theme="dark"]{
  --bg:#111112; --panel:#19191b; --panel-2:#151517; --panel-3:#202023; --canvas:#111112;
  --line:#27272a; --line-2:#323236; --line-3:#4b4b50;
  --t1:#f2f2f0; --t2:#b3b2ad; --t3:#7b7a76; --t4:#4e4e52;
  --ink:#f2f2f0; --ink-fg:#111112; --ink-soft:rgba(242,242,240,.07); --ink-soft-2:rgba(242,242,240,.12);
  --sel:#5b8cff; --sel-soft:rgba(91,140,255,.12); --sel-ring:rgba(91,140,255,.35);
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 6px 20px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); --sh-3:0 20px 50px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5);
  --brand:#f2f2f0; --brand-fg:#111112;
}

/* ============================================================ Base */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:13px;line-height:1.45;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}
::selection{background:var(--sel-soft)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:var(--r1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--t3);line-height:1.5;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:padding-box;border:2px solid transparent}
[hidden]{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--panel);font-weight:500;color:var(--t1);white-space:nowrap;transition:background var(--fast),border-color var(--fast),color var(--fast),transform 60ms,box-shadow var(--fast)}
.btn:hover{background:var(--panel-2);border-color:var(--line-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--ink-soft);color:var(--t1)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--err)}.btn.danger:hover{background:var(--err-soft);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn .kbd{margin-left:2px}

/* Segmented control */
.seg{display:inline-flex;position:relative;background:var(--panel-3);border-radius:var(--r2);padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:7px;font-weight:500;color:var(--t2);transition:color var(--fast)}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed="true"]{color:var(--t1)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;background:var(--panel);border-radius:7px;box-shadow:var(--sh-1);transition:transform var(--med) var(--ease),width var(--med) var(--ease);z-index:0}
.seg.icons button{width:30px;padding:0}
.seg.pill,.seg.pill .thumb{border-radius:999px}.seg.pill button{border-radius:999px;height:24px;width:28px}

/* Tooltips */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translate(-50%,2px);background:var(--t1);color:var(--bg);font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--fast),transform var(--fast);z-index:40;font-family:var(--font);letter-spacing:0;text-transform:none}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);transition-delay:300ms}
[data-tip-pos="bottom"]::after{bottom:auto;top:calc(100% + 7px);transform:translate(-50%,-2px)}
[data-tip-pos="bottom"]:hover::after{transform:translate(-50%,0)}
[data-tip-pos="left"]::after{bottom:auto;left:auto;right:calc(100% + 7px);top:50%;transform:translate(2px,-50%)}
[data-tip-pos="left"]:hover::after{transform:translate(0,-50%)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--panel-3);color:var(--t2);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);transition:background var(--med)}
.pill.dirty .dot{background:var(--warn)}
.pill.mono{font-family:var(--mono);font-size:11px}

/* ============================================================ Shell */
.app{display:grid;grid-template-rows:var(--top) 1fr;grid-template-columns:var(--left) 1fr var(--right);height:100vh;height:100dvh;transition:grid-template-columns var(--med) var(--ease)}
.app.resizing{transition:none;user-select:none;cursor:col-resize}
.app[data-left="closed"]{grid-template-columns:0 1fr var(--right)}
.app[data-right="closed"]{grid-template-columns:var(--left) 1fr 0}
.app[data-left="closed"][data-right="closed"]{grid-template-columns:0 1fr 0}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20;gap:8px}
.topbar .l,.topbar .r{display:flex;align-items:center;gap:6px;min-width:0}
.topbar .r{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;padding:4px 6px;border-radius:var(--r1);white-space:nowrap}
.mark{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--ink-fg);flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.name-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:var(--r1);font-weight:600;font-size:13.5px;color:var(--t1);min-width:0;transition:background var(--fast)}
.name-btn:hover{background:var(--ink-soft)}
.name-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.name-btn svg{color:var(--t3)}
.topbar .sep{color:var(--t4);margin:0 2px}

/* Panels */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.panel.left{border-right:1px solid var(--line);grid-column:1}
.panel.right{border-left:1px solid var(--line);grid-column:3}
.panel>*:not(.resizer){min-width:var(--pw)}
.panel.left{--pw:var(--left)}.panel.right{--pw:var(--right)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 10px 0 14px;flex:none}
.ph .t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}
.ph .meta{font-size:11px;color:var(--t4);font-variant-numeric:tabular-nums}
.resizer{position:absolute;top:0;bottom:0;width:7px;min-width:0;cursor:col-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background var(--fast)}
.resizer:hover::after,.resizer.on::after{background:var(--sel)}
.panel.left .resizer{right:-4px}.panel.right .resizer{left:-4px}

/* ============================================================ Tree */
.search{position:relative;margin:0 10px 6px;flex:none}
.search input{width:100%;height:32px;padding:0 30px 0 32px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel-2);transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
.search input::placeholder{color:var(--t3)}
.search input:focus{outline:0;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-ring);background:var(--panel)}
.search>svg{position:absolute;left:10px;top:9px;color:var(--t3);pointer-events:none}
.search .kbd{position:absolute;right:8px;top:7px}
.tree{flex:1;padding:2px 8px 84px}
.node{position:relative;user-select:none}
.row{display:flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 4px;border-radius:var(--r1);color:var(--t2);cursor:pointer;position:relative;transition:background var(--fast),color var(--fast)}
.row:hover{background:var(--ink-soft);color:var(--t1)}
.row[aria-selected="true"]{background:var(--sel-soft);color:var(--t1)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--sel)}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .lbl mark{background:rgba(250,204,21,.4);color:inherit;border-radius:2px;padding:0 1px}
.row.sec .lbl{font-weight:600;color:var(--t1)}
.row.sec{height:32px;margin-top:2px}
.row .n{font-size:10.5px;color:var(--t4);font-variant-numeric:tabular-nums;padding:0 4px;opacity:0;transition:opacity var(--fast)}
.row:hover .n{opacity:1}
.row .grip{width:10px;height:20px;display:grid;place-items:center;color:var(--t4);opacity:0;cursor:grab;flex:none;margin-left:-2px;transition:opacity var(--fast)}
.row:hover .grip{opacity:1}.row .grip:active{cursor:grabbing}
.row .caret{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--t3);flex:none;transition:transform var(--med) var(--ease),background var(--fast)}
.row .caret:hover{background:var(--ink-soft-2);color:var(--t1)}
.node[data-open="false"]>.row .caret{transform:rotate(-90deg)}
.kids{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.kids>div{overflow:hidden;min-height:0}
.node[data-open="false"]>.kids{grid-template-rows:0fr}
.node.scr>.kids>div{padding-left:14px;position:relative}
.node.scr>.kids>div::before{content:"";position:absolute;left:21px;top:2px;bottom:4px;width:1px;background:var(--line)}
.node.sec>.kids>div{padding-left:10px}
.row .ico{width:16px;height:16px;display:grid;place-items:center;color:var(--t3);flex:none}
.row.fld{height:28px}
.row .flag{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;margin:0 4px}
.row .more{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--t3);opacity:0;flex:none;transition:opacity var(--fast),background var(--fast)}
.row:hover .more,.row:focus-within .more{opacity:1}
.row .more:hover{background:var(--ink-soft-2);color:var(--t1)}
.node.dragging>.row{opacity:.35}
.node.drop-before>.row::after,.node.drop-after>.row::after{content:"";position:absolute;left:26px;right:6px;height:2px;background:var(--sel);border-radius:2px;z-index:2}
.node.drop-before>.row::after{top:-1px}.node.drop-after>.row::after{bottom:-1px}
.node.drop-into>.row{box-shadow:inset 0 0 0 1.5px var(--sel)}
.tree-empty{padding:32px 16px;text-align:center;color:var(--t3)}
.tree-empty b{display:block;color:var(--t2);font-weight:600;margin-bottom:2px}
.tree-foot{position:absolute;bottom:0;left:0;right:0;padding:10px 12px 12px;display:flex;gap:6px;background:linear-gradient(to top,var(--panel) 75%,transparent)}
.tree-foot .btn{flex:1;min-width:0}
.tree-foot .btn span{overflow:hidden;text-overflow:ellipsis}

/* ============================================================ Canvas */
.stage{position:relative;background:var(--canvas);min-width:0;display:flex;flex-direction:column;overflow:hidden;grid-column:2}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;flex:none;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--t3);white-space:nowrap}
.crumb .c{overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer;transition:color var(--fast)}
.crumb .c:hover{color:var(--t1)}
.crumb .c.cur{color:var(--t1);font-weight:600}
.crumb .sep{color:var(--t4);flex:none}
.stage-tools{display:flex;align-items:center;gap:6px;flex:none}
.stage-tools .seg{background:var(--panel);border-color:var(--line)}
.zoom{display:inline-flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px;height:30px}
.zoom button{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;color:var(--t2);transition:background var(--fast)}
.zoom button:hover{background:var(--ink-soft);color:var(--t1)}
.zoom span{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--t2);min-width:40px;text-align:center;cursor:pointer}
.stage-scroll{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:8px clamp(16px,4vw,48px) 120px}
.device{width:100%;max-width:720px;transition:max-width var(--slow) var(--ease)}
.stage[data-device="mobile"] .device{max-width:390px}
.stage[data-device="tablet"] .device{max-width:600px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);box-shadow:var(--sh-2);overflow:hidden;transform-origin:top center;transition:transform var(--med) var(--ease);font-family:var(--frame-font);color-scheme:light}
.frame[data-scheme="light"]{--fp:#ffffff;--fp2:#f6f6f5;--fl:#e6e5e2;--fl2:#d4d2cd;--ft1:#18181a;--ft2:#5c5b57;--ft3:#8d8b85}
.frame[data-scheme="dark"]{--fp:#18181a;--fp2:#1f1f22;--fl:#2b2b2f;--fl2:#3a3a40;--ft1:#f2f2f0;--ft2:#b3b2ad;--ft3:#7b7a76;color-scheme:dark}
.frame{background:var(--fp);color:var(--ft1)}
.frame-top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--fl);background:var(--fp2)}
.frame-top .lg{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.frame-top .lg .mark{width:20px;height:20px;border-radius:6px;background:var(--brand);color:var(--brand-fg)}
.frame-top .steps{font-family:var(--mono);font-size:11px;color:var(--ft3)}
.progress{height:3px;background:var(--fl)}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width var(--slow) var(--ease)}
.scr-body{padding:40px clamp(20px,7%,56px) 44px;min-height:380px;display:flex;flex-direction:column;gap:18px}
.scr-in{animation:scrin var(--slow) var(--ease)}
@keyframes scrin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scr-title{position:relative;text-align:center;font-size:var(--title-size,24px);font-weight:var(--title-weight,600);letter-spacing:-.02em;line-height:1.25;margin:0;padding:6px 10px;border-radius:var(--r2);transition:box-shadow var(--fast)}
.scr-title:empty::before{content:"Untitled screen";color:var(--ft3)}
.stage[data-mode="edit"] .scr-title:hover{box-shadow:inset 0 0 0 1px var(--fl2)}
.stage[data-mode="edit"] .scr-title.sel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.scr-title[contenteditable]:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--sel),0 0 0 4px var(--sel-ring)}
.scr-desc{text-align:center;color:var(--ft2);margin:-8px 0 0;font-size:14px}
.fields{display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.fw{position:relative;border-radius:var(--r3);padding:28px 10px 10px;margin:-20px -10px -10px;transition:box-shadow var(--fast),background var(--fast)}
.stage[data-mode="test"] .fw{padding-top:10px;margin-top:-10px}
.stage[data-mode="edit"] .fw{cursor:pointer}
.stage[data-mode="edit"] .fw:hover{box-shadow:inset 0 0 0 1px var(--fl2)}
.stage[data-mode="edit"] .fw.sel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.fw .hd{position:absolute;top:6px;left:10px;right:8px;height:18px;display:flex;align-items:center;justify-content:space-between;opacity:0;transition:opacity var(--fast)}
.stage[data-mode="edit"] .fw:hover .hd,.stage[data-mode="edit"] .fw.sel .hd{opacity:1}
.fw .tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ft3)}
.fw.sel .tag{color:var(--sel)}
.fw .fx{display:flex;gap:1px;opacity:0;transition:opacity var(--fast)}
.fw.sel .fx{opacity:1}
.fw .fx button{width:20px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ft3);transition:background var(--fast),color var(--fast)}
.fw .fx button:hover{background:var(--fl);color:var(--ft1)}
.fw .fx button.del:hover{background:var(--err-soft);color:var(--err)}
.fl{display:flex;align-items:baseline;gap:4px;font-weight:500;font-size:14px;margin-bottom:8px;color:var(--ft1)}
.fl .req{color:var(--err);font-weight:600}
.fl .opt{color:var(--ft3);font-weight:400;font-size:12px;margin-left:4px}
.fd{color:var(--ft2);font-size:12.5px;margin:-4px 0 8px}
.ferr{display:flex;align-items:center;gap:6px;color:var(--err);font-size:12.5px;margin-top:8px;animation:scrin var(--med) var(--ease)}
.fw.err .choice,.fw.err .inp{border-color:var(--err)}
.fw.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border:1px solid var(--fl2);border-radius:var(--field-radius,12px);background:var(--fp);transition:border-color var(--fast),box-shadow var(--fast),transform 60ms;cursor:pointer;color:var(--ft1)}
.choice:hover{border-color:var(--ft3)}
.choice:active{transform:scale(.995)}
.choice.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.choice .ci{width:18px;height:18px;color:var(--ft2)}
.choice .ct{flex:1;font-weight:500;font-size:14px}
.choice .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--fl2);display:grid;place-items:center;color:var(--brand-fg);transition:background var(--fast),border-color var(--fast)}
.choice.on .ck{background:var(--brand);border-color:var(--brand)}
.choice .ck svg{opacity:0;transform:scale(.6);transition:opacity var(--fast),transform var(--fast)}
.choice.on .ck svg{opacity:1;transform:none}
.choice.multi .ck{border-radius:6px}
.inp{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid var(--fl2);border-radius:var(--field-radius,12px);background:var(--fp);color:var(--ft3);font-size:14px;transition:border-color var(--fast),box-shadow var(--fast)}
.inp .pre{font-weight:500;color:var(--ft2)}
.inp.ta{height:auto;min-height:92px;align-items:flex-start;padding-top:12px}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.inp input{flex:1;border:0;background:transparent;outline:0;min-width:0;color:var(--ft1);font:inherit}
.inp input::placeholder{color:var(--ft3)}
.inp svg{color:var(--ft3)}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yesno .choice{min-height:46px;justify-content:center}
.yesno .choice .ck{display:none}
.add-field{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:1px dashed var(--fl2);border-radius:var(--r3);color:var(--ft3);font-weight:500;max-width:520px;width:100%;margin:4px auto 0;transition:border-color var(--fast),color var(--fast),background var(--fast)}
.add-field:hover{border-color:var(--ft3);color:var(--ft1);background:var(--fp2)}
.stage[data-mode="test"] .add-field{display:none}
.scr-nav{display:none;max-width:520px;width:100%;margin:10px auto 0;align-items:center;justify-content:space-between;gap:10px}
.stage[data-mode="test"] .scr-nav{display:flex}
.scr-nav .btn{height:44px;padding:0 20px;border-radius:12px;font-size:14px;background:var(--fp);border-color:var(--fl2);color:var(--ft1)}
.scr-nav .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.scr-empty{padding:36px 20px;text-align:center;color:var(--ft3);display:flex;flex-direction:column;align-items:center;gap:10px}
.scr-empty b{color:var(--ft2);font-weight:600}
.scr-empty .ic{width:40px;height:40px;border-radius:12px;background:var(--fp2);display:grid;place-items:center;color:var(--ft3)}
.done{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:scrin var(--slow) var(--ease)}
.done .ic{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center}
.done h2{margin:6px 0 0;font-size:22px;letter-spacing:-.02em}
.done p{margin:0;color:var(--ft2)}

/* Dock */
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);z-index:10;max-width:calc(100% - 32px)}
.dock button{position:relative;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--t2);transition:background var(--fast),color var(--fast);flex:none}
.dock button:hover{background:var(--ink-soft);color:var(--t1)}
.dock button:disabled{opacity:.3;cursor:not-allowed}
.dock button.danger:hover{background:var(--err-soft);color:var(--err)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.dock .m-only{display:none}
.m-close{display:none}

/* ============================================================ Inspector */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:8px 10px 0;padding:3px;background:var(--panel-3);border-radius:var(--r2);border:1px solid var(--line);position:relative;flex:none}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;height:44px;justify-content:center;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--t2);position:relative;z-index:1;transition:color var(--fast)}
.tabs button:hover{color:var(--t1)}
.tabs button[aria-selected="true"]{color:var(--t1)}
.tabs .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(25% - 3px);background:var(--panel);border-radius:7px;box-shadow:var(--sh-1);transition:transform var(--med) var(--ease);z-index:0}
.insp{flex:1;padding:4px 0 48px}
.ictx{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-width:0}
.ictx .kind{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:var(--panel-3);color:var(--t2);font-size:11px;font-weight:600;flex:none}
.ictx .kind.field{background:var(--sel-soft);color:var(--sel)}
.ictx .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ictx .acts{display:flex;gap:2px;flex:none}
.ictx .acts button:not(.btn){width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--t3);transition:background var(--fast),color var(--fast)}
.ictx .acts .btn{white-space:nowrap}
.ictx .acts button:hover{background:var(--ink-soft);color:var(--t1)}
.ictx .acts button.del:hover{background:var(--err-soft);color:var(--err)}
.ipath{display:flex;align-items:center;gap:4px;padding:0 14px 8px;font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden}
.ipath button{color:var(--t3);overflow:hidden;text-overflow:ellipsis;max-width:46%;transition:color var(--fast)}
.ipath button:hover{color:var(--t1)}
.ipath .sep{color:var(--t4)}
.sec{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left;font-weight:600;font-size:12.5px;color:var(--t1);transition:background var(--fast)}
.sec-h:hover{background:var(--panel-2)}
.sec-h .hint{font-weight:400;color:var(--t3);font-size:11.5px;margin-left:auto}
.sec-h .chev{color:var(--t3);transition:transform var(--med) var(--ease);margin-left:6px}
.sec-h .hint+.chev{margin-left:6px}.sec-h .chev:only-of-type{margin-left:auto}
.sec[data-open="false"] .sec-h .chev{transform:rotate(-90deg)}
.sec-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.sec[data-open="false"] .sec-w{grid-template-rows:0fr}
.sec-w>div{overflow:hidden;min-height:0}
.sec-b{padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:11.5px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:6px}
.f .sub{font-size:11px;color:var(--t3)}
.ctl{height:32px;width:100%;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--panel);transition:border-color var(--fast),box-shadow var(--fast);min-width:0}
.ctl:hover{border-color:var(--line-3)}
.ctl:focus{outline:0;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-ring)}
.ctl::placeholder{color:var(--t3)}
textarea.ctl{height:auto;min-height:34px;padding:7px 10px;resize:none;line-height:1.45;transition:min-height var(--med) var(--ease),border-color var(--fast),box-shadow var(--fast)}
textarea.ctl:focus,textarea.ctl.has{min-height:68px}
textarea.code{font-family:var(--mono);font-size:11.5px;min-height:240px;background:var(--panel-2);white-space:pre;tab-size:2;resize:vertical}
.selw{position:relative;min-width:0}
.selw select{appearance:none;-webkit-appearance:none;padding-right:28px;cursor:pointer;text-overflow:ellipsis}
.selw::after{content:"";position:absolute;right:11px;top:11px;width:6px;height:6px;border-right:1.5px solid var(--t3);border-bottom:1.5px solid var(--t3);transform:rotate(45deg);pointer-events:none}
.ctl-ico{position:relative}
.ctl-ico .ctl{padding-left:30px}
.ctl-ico>svg{position:absolute;left:9px;top:9px;color:var(--t3);pointer-events:none}
.ctl-ico .unit{position:absolute;right:10px;top:8px;font-size:11px;color:var(--t3);pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .t{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background var(--med);flex:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--med) var(--ease)}
.sw input:checked+.t{background:var(--ok)}
.sw input:checked+.t::after{transform:translateX(12px)}
.sw input:focus-visible+.t{box-shadow:0 0 0 3px var(--sel-ring)}
.sw .l{font-weight:500;line-height:1.3}
.sw .d{color:var(--t3);font-size:11.5px;display:block;font-weight:400}
.segi{display:inline-flex;gap:2px;padding:2px;background:var(--panel-3);border:1px solid var(--line);border-radius:8px}
.segi.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.segi button{height:26px;min-width:28px;padding:0 8px;border-radius:6px;display:grid;place-items:center;color:var(--t2);font-size:12px;font-weight:500;transition:background var(--fast),color var(--fast),box-shadow var(--fast)}
.segi button:hover{color:var(--t1)}
.segi button[aria-pressed="true"]{background:var(--panel);color:var(--t1);box-shadow:var(--sh-1)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:12px 1fr 24px;align-items:center;gap:6px;padding:4px 4px 4px 2px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2);transition:border-color var(--fast),box-shadow var(--fast)}
.opt:focus-within{border-color:var(--line-3)}
.opt.dragging{opacity:.4}
.opt .grip{color:var(--t4);cursor:grab;display:grid;place-items:center}
.opt .ctl{height:28px;font-size:12.5px;background:var(--panel)}
.opt .val{grid-column:2;display:flex;align-items:center;gap:6px;padding:0 2px;font-family:var(--mono);font-size:10.5px;color:var(--t3);cursor:text}
.opt .val input{border:0;background:transparent;outline:0;font:inherit;color:inherit;min-width:0;flex:1;padding:2px 0}
.opt .val input:focus{color:var(--t1)}
.opt .rm{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--t3);transition:background var(--fast),color var(--fast)}
.opt .rm:hover{background:var(--err-soft);color:var(--err)}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border:1px dashed var(--line-2);border-radius:var(--r1);color:var(--t2);font-weight:500;transition:border-color var(--fast),color var(--fast),background var(--fast)}
.add-row:hover{border-color:var(--line-3);color:var(--t1);background:var(--panel-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:12px;color:var(--t2);transition:border-color var(--fast),background var(--fast),color var(--fast)}
.chip:hover{border-color:var(--line-3);color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip .sw2{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.map{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2);min-width:0}
.map .mi{width:26px;height:26px;border-radius:7px;background:var(--sel-soft);color:var(--sel);display:grid;place-items:center;flex:none}
.map .mt{flex:1;min-width:0}
.map .mt b{display:block;font-family:var(--mono);font-weight:500;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map .mt span{font-size:11px;color:var(--t3)}
.map button{color:var(--t3);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;transition:background var(--fast),color var(--fast)}
.map button:hover{background:var(--ink-soft);color:var(--t1)}
.cond{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel-2)}
.cond .cl{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center}
.cond .cl .w{font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.cond .ctl{height:28px;font-size:12px;background:var(--panel)}
.cond .ft{display:flex;justify-content:flex-end}
.cond .ft button{color:var(--t3);font-size:11.5px;padding:2px 4px;border-radius:4px}
.cond .ft button:hover{color:var(--err)}
.empty{padding:14px 12px;text-align:center;color:var(--t3);border:1px dashed var(--line-2);border-radius:var(--r2);font-size:12.5px;line-height:1.4}
.empty b{display:block;color:var(--t2);font-weight:600;margin-bottom:1px}
.insp-empty{padding:56px 24px;text-align:center;color:var(--t3)}
.insp-empty .ic{width:44px;height:44px;border-radius:12px;background:var(--panel-3);display:grid;place-items:center;margin:0 auto 12px;color:var(--t3)}
.insp-empty b{display:block;color:var(--t1);font-weight:600;margin-bottom:4px}
.drop{display:flex;align-items:center;gap:10px;padding:8px;border:1px dashed var(--line-2);border-radius:var(--r2);transition:border-color var(--fast),background var(--fast);cursor:pointer;position:relative;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--sel);background:var(--sel-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .di{width:40px;height:40px;border-radius:9px;background:var(--panel-3);display:grid;place-items:center;color:var(--t2);flex:none;overflow:hidden}
.drop .di img{width:100%;height:100%;object-fit:contain}
.drop b{display:block;font-weight:600}
.drop span{color:var(--t3);font-size:11.5px}
.drop .x{position:relative;z-index:2;margin-left:auto}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.swatch{aspect-ratio:1;border-radius:8px;position:relative;cursor:pointer;transition:transform 80ms;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border:2px solid var(--sel);border-radius:11px}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow .cw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 6px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--panel);flex:1;position:relative;cursor:pointer;min-width:0}
.colorrow .cw i{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
.colorrow .cw span{font-family:var(--mono);font-size:11.5px;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.colorrow .cw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fontlist{display:flex;flex-direction:column;gap:4px}
.fontlist button{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r1);text-align:left;transition:border-color var(--fast),background var(--fast)}
.fontlist button:hover{border-color:var(--line-3)}
.fontlist button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}
.fontlist b{font-weight:500;font-size:14px}
.fontlist span{font-size:11px;color:var(--t3)}
.note{font-size:11.5px;color:var(--t3);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.note svg{flex:none;margin-top:2px}
.note.ok{color:var(--ok)}.note.ok span{color:var(--t2)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stylecard{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2)}
.stylecard b{flex:1;font-weight:500}
.stylecard span{font-size:11px;color:var(--t3)}

/* ============================================================ Overlays */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;background:var(--t1);color:var(--bg);border-radius:12px;box-shadow:var(--sh-3);font-weight:500;animation:tin var(--med) var(--ease);min-width:200px;max-width:360px}
.toast .ti{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.toast.ok .ti{background:var(--ok);color:#fff}.toast.warn .ti{background:var(--warn);color:#fff}
.toast .tx{flex:1}
.toast .btn{background:rgba(255,255,255,.12);border-color:transparent;color:inherit;height:26px}
.toast.out{animation:tout 180ms forwards}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;animation:fade var(--fast)}
.scrim[data-open="true"]{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--med) var(--ease);display:flex;flex-direction:column;max-height:80vh}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.mh h2{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.palette{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--med) var(--ease)}
.palette .search{margin:8px}
.palette .search input{height:42px;font-size:14px;background:var(--panel)}
.pal-list{max-height:52vh;overflow:auto;padding:0 8px 8px}
.pal-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:600;padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;transition:background var(--fast)}
.pal-i:hover,.pal-i[aria-selected="true"]{background:var(--ink-soft)}
.pal-i .ico{width:26px;height:26px;border-radius:7px;background:var(--panel-3);display:grid;place-items:center;color:var(--t2);flex:none}
.pal-i .tx{flex:1;min-width:0}
.pal-i .tx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i .tx span{color:var(--t3);font-size:11.5px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.typecard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left;transition:border-color var(--fast),background var(--fast),transform 80ms}
.typecard:hover,.typecard:focus-visible{border-color:var(--line-3);background:var(--panel-2);transform:translateY(-1px)}
.typecard .ico{width:30px;height:30px;border-radius:8px;background:var(--panel-3);display:grid;place-items:center;color:var(--t2)}
.typecard b{font-weight:600;font-size:12.5px}
.typecard span{color:var(--t3);font-size:11.5px;line-height:1.35}
.checklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.checklist li.clk{cursor:pointer;transition:background var(--fast)}.checklist li.clk:hover{background:var(--ink-soft)}
.checklist .ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.checklist .ci.ok{background:var(--ok)}.checklist .ci.warn{background:var(--warn)}
.checklist b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist span{color:var(--t3);font-size:11.5px;flex:none}
.ctxmenu{position:fixed;z-index:70;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-3);padding:4px;display:none;animation:pop var(--fast) var(--ease)}
.ctxmenu[data-open="true"]{display:block}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:6px;text-align:left;font-weight:500;color:var(--t1)}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--ink-soft);outline:0}
.ctxmenu button.danger{color:var(--err)}.ctxmenu button.danger:hover{background:var(--err-soft)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 2px}
.ctxmenu .kbd{margin-left:auto}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.shortcuts div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.shortcuts div span:first-child{color:var(--t2)}

/* ============================================================ Responsive */
@media (max-width:1180px){:root{--left:252px;--right:312px}}
@media (max-width:900px){
  .app{grid-template-columns:1fr!important}
  .stage{grid-column:1}
  .panel.left,.panel.right{position:fixed;top:var(--top);bottom:0;width:min(86vw,340px);z-index:40;box-shadow:var(--sh-3);transform:translateX(-100%);transition:transform var(--med) var(--ease)}
  .panel.right{right:0;left:auto;transform:translateX(100%)}
  .app[data-left="open"] .panel.left,.app[data-right="open"] .panel.right{transform:none}
  .panel>*:not(.resizer){min-width:0}
  .resizer{display:none}
  .topbar{grid-template-columns:auto 1fr auto;padding:0 6px;gap:4px}
  .topbar .logo{display:none}
  .topbar .sep,.btn .kbd,#saveBtn,#publishBtn span{display:none}
  #publishBtn{width:32px;padding:0}
  .name-btn{flex:1;min-width:0;padding:0 6px}
  .name-btn span{max-width:none;flex:1}
  .pill#savePill{width:22px;padding:0;justify-content:center;flex:none}
  .pill#savePill #saveText{display:none}
  .stage-bar{padding:8px 10px;gap:8px}
  .crumb{flex:1}
  .zoom,#themeBtn,#devSeg{display:none}
  .stage-scroll{padding:4px 10px 112px}
  .device,.stage[data-device] .device{max-width:none}
  .frame{border-radius:var(--r3)}
  .scr-body{padding:24px 16px 24px;min-height:0}
  .fields{gap:12px}
  .dock{bottom:calc(12px + env(safe-area-inset-bottom));gap:0;padding:4px}
  .dock .m-hide{display:none}
  .dock .m-only{display:grid}
  .drawer-scrim{position:fixed;inset:var(--top) 0 0;background:rgba(0,0,0,.35);z-index:35;display:none;animation:fade var(--fast)}
  .app[data-left="open"] .drawer-scrim,.app[data-right="open"] .drawer-scrim{display:block}
  .ctl,.search input,.inp input,.inp select,.opt .ctl,textarea.ctl{font-size:16px}
  .opt .val input{font-size:12px}
  .scrim{padding:6vh 10px 10px}
  .modal{max-height:88vh}
  .tree-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .insp{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .toasts{left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{min-width:0;max-width:none}
  .stage[data-mode="test"] #dockAdd{display:none}
  .m-close{display:grid;position:absolute;top:8px;right:8px;z-index:6}
  .panel.right .m-close{top:11px;right:14px}
  .panel.right .tabs{margin-right:46px}
  .panel.left .ph{padding-right:44px}
}
@media (hover:none){
  .row .more,.row .n,.row .grip{opacity:1}
  .fw.sel .hd,.fw.sel .fx{opacity:1}
  [data-tip]::after{display:none}
  .choice:hover{border-color:var(--fl2)}
}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}.shortcuts{grid-template-columns:1fr}.topbar .seg button{padding:0 9px}.topbar .seg button .w{display:none}.typegrid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}
@media print{.topbar,.panel,.dock,.stage-bar{display:none!important}.app{display:block}.stage{background:#fff}}

<script>
/* ============================================================
   Model
   ============================================================ */
const TYPES = {
  choice:  {label:'Single choice', icon:'i-choice',   desc:'Pick one'},
  multi:   {label:'Multiple choice', icon:'i-multi',  desc:'Pick any'},
  yesno:   {label:'Yes / No', icon:'i-yesno',         desc:'Two buttons'},
  select:  {label:'Dropdown', icon:'i-select',        desc:'Long lists'},
  text:    {label:'Short text', icon:'i-text',        desc:'One line'},
  textarea:{label:'Long text', icon:'i-para',         desc:'Paragraph'},
  currency:{label:'Amount', icon:'i-currency',        desc:'Dollars'},
  number:  {label:'Number', icon:'i-number',          desc:'Digits only'},
  date:    {label:'Date', icon:'i-date',              desc:'Calendar date'},
  email:   {label:'Email', icon:'i-email',            desc:'Validated'},
  phone:   {label:'Phone', icon:'i-phone',            desc:'Formatted'},
  address: {label:'Address', icon:'i-address',        desc:'Street lookup'},
};
const HAS_OPTS = t => ['choice','multi','select'].includes(t);
const FONTS = { inter:{label:'Inter',css:"'Inter',system-ui,sans-serif"}, manrope:{label:'Manrope',css:"'Manrope',system-ui,sans-serif"}, plex:{label:'IBM Plex Sans',css:"'IBM Plex Sans',system-ui,sans-serif"}, serif:{label:'Source Serif',css:"'Source Serif 4',Georgia,serif"}, system:{label:'System UI',css:"system-ui,-apple-system,sans-serif"} };
const BRAND = { ink:'#18181a', ocean:'#2563eb', indigo:'#6d4aff', forest:'#15803d', rose:'#e11d48', amber:'#d97706', teal:'#0d9488', slate:'#475569' };
const US_STATES = ['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];
const MAPPINGS = ['property.purpose','property.search_stage','property.type','property.occupancy','property.state','property.county','property.address.street','property.address.unit','property.address.city','property.address.zip','property.purchase_price','property.estimated_value','property.rent','property.hoa','loan.cash_out','loan.roll_closing_costs','loan.escrow','loan.target_close','loan.deposit_paid','borrower.first_name','borrower.middle_name','borrower.last_name','borrower.email','borrower.phone','borrower.phone_type','borrower.dob','borrower.marital','borrower.citizenship','borrower.military','borrower.prior_owner','borrower.has_dependents','borrower.current.street','borrower.current.city','borrower.current.zip','borrower.current.status','borrower.current.payment','income.status','income.employer','income.base','assets.liquid','assets.gift','credit.soft_pull_consent','declarations.bankruptcy','declarations.judgments','consent.contact','consent.info_use','application.attest','hmda.ethnicity','hmda.sex','entity.name','entity.type'];

let uid = 1; const id = p => p + '_' + (uid++).toString(36);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const opts = (...o) => o.map(l => ({ id:id('o'), label:l, value:slug(l) }));
const F = (label, type, x={}) => ({ id:id('f'), label, type, required:true, description:'', map:'', validation:'none', width:'auto', remember:true, options:[], conditions:[], ...x });
const S = (title, fields, x={}) => ({ id:id('s'), title, description:'', fields, conditions:[], open:false, ...x });
const SEC = (title, screens, x={}) => ({ id:id('sec'), title, screens, open:false, ...x });

function seed(){
  uid = 1;
  return {
    name:'Loan application',
    brand:{ name:'Pylon', color:'ink', custom:'#2563eb', logo:null, logoDark:null },
    style:{ scheme:'light', font:'inter', titleSize:'24', titleWeight:'600', radius:'12' },
    styles:[],
    sections:[
      SEC('Your loan',[
        S('What is your loan for?',[ F('What is your loan for?','choice',{ map:'property.purpose', options:opts('Buy a home','Refinance'), icons:['i-home','i-refresh'] }) ],{open:true}),
        S('Where are you in your home search?',[ F('Where are you in your home search?','choice',{ map:'property.search_stage', options:opts('Just getting started','Actively looking','Under contract'), conditions:[{field:'property.purpose',op:'equals',value:'buy_a_home'}] }) ]),
        S('How much cash would you like?',[ F('How much cash would you like?','currency',{ map:'loan.cash_out', required:false, conditions:[{field:'property.purpose',op:'equals',value:'refinance'}] }) ]),
        S('Include closing costs in your loan?',[ F('Include closing costs in your loan?','yesno',{ map:'loan.roll_closing_costs' }) ]),
        S('Where you want to buy',[ F('Where are you looking to buy?','select',{ map:'property.state', optsrc:'states' }), F('Which county?','text',{ map:'property.county', required:false }) ]),
        S('About the property',[ F('What kind of property is it?','choice',{ map:'property.type', options:opts('Single family','Condo','Townhouse','Multi-family') }), F('How will you use this property?','choice',{ map:'property.occupancy', options:opts('Primary residence','Second home','Investment') }), F('Estimated monthly rent','currency',{ map:'property.rent', required:false, conditions:[{field:'property.occupancy',op:'equals',value:'investment'}] }), F('Monthly HOA dues','currency',{ map:'property.hoa', required:false }), F('Is your home attached to a neighbor’s?','yesno',{ map:'property.attached' }), F('Include taxes and insurance in your payment?','yesno',{ map:'loan.escrow' }) ]),
        S('Where is the property?',[ F('Street address','address',{ map:'property.address.street' }), F('Apartment, suite or unit','text',{ map:'property.address.unit', required:false }), F('City','text',{ map:'property.address.city' }), F('ZIP code','text',{ map:'property.address.zip', validation:'zip' }) ]),
        S('Property value',[ F('What is the purchase price?','currency',{ map:'property.purchase_price' }), F('What is the estimated property value?','currency',{ map:'property.estimated_value' }) ]),
        S('Purchase details',[ F('When do you expect to close?','date',{ map:'loan.target_close' }), F('How much deposit have you paid?','currency',{ map:'loan.deposit_paid', required:false }) ]),
      ],{open:true}),
      SEC('About you',[
        S('Business ownership',[ F('Will this loan close in a business’s name?','yesno',{ map:'borrower.entity' }), F('Business name','text',{ map:'entity.name', conditions:[{field:'borrower.entity',op:'equals',value:'yes'}] }), F('What type of business is it?','select',{ map:'entity.type', options:opts('LLC','Corporation','Partnership','Trust'), conditions:[{field:'borrower.entity',op:'equals',value:'yes'}] }) ]),
        S('Your personal details',[ F('First name','text',{ map:'borrower.first_name', width:'half' }), F('Last name','text',{ map:'borrower.last_name', width:'half' }), F('Date of birth','date',{ map:'borrower.dob', validation:'adult' }), F('Email address','email',{ map:'borrower.email', validation:'email' }), F('Phone number','phone',{ map:'borrower.phone', validation:'phone' }) ]),
        S('A little more about you',[ F('Have you owned property in the past three years?','yesno',{ map:'borrower.prior_owner' }), F('What is your marital status?','choice',{ map:'borrower.marital', options:opts('Married','Unmarried','Separated') }), F('Do you have military service or surviving-spouse eligibility?','yesno',{ map:'borrower.military' }) ]),
        S('Who else is applying?',[ F('Add another borrower?','yesno',{ map:'application.coborrower' }) ]),
        S('Residency and household',[ F('What is your citizenship or residency status?','choice',{ map:'borrower.citizenship', options:opts('U.S. citizen','Permanent resident','Non-permanent resident') }), F('Do you have dependents?','yesno',{ map:'borrower.has_dependents' }), F('Dependent ages','text',{ map:'borrower.dependent_ages', required:false, conditions:[{field:'borrower.has_dependents',op:'equals',value:'yes'}] }) ]),
        S('Contact preferences',[ F('How may we contact you?','multi',{ map:'consent.contact', options:opts('Email','Phone','Text message') }), F('I agree to the use of my information','yesno',{ map:'consent.info_use' }) ]),
      ]),
      SEC('Where you live',[
        S('Current address',[ F('Street address','address',{ map:'borrower.current.street' }), F('City','text',{ map:'borrower.current.city', width:'half' }), F('ZIP code','text',{ map:'borrower.current.zip', validation:'zip', width:'half' }) ]),
        S('Housing',[ F('Do you rent or own?','choice',{ map:'borrower.current.status', options:opts('Own','Rent','Live rent-free') }), F('Monthly housing payment','currency',{ map:'borrower.current.payment', conditions:[{field:'borrower.current.status',op:'not_equals',value:'live_rent_free'}] }), F('When did you move in?','date',{ map:'borrower.current.move_in' }) ]),
      ]),
      SEC('Your finances',[
        S('Employment',[ F('Employment status','choice',{ map:'income.status', options:opts('Employed','Self-employed','Retired','Not employed') }), F('Employer name','text',{ map:'income.employer', conditions:[{field:'income.status',op:'equals',value:'employed'}] }), F('Annual base income','currency',{ map:'income.base' }) ]),
        S('Assets',[ F('Total liquid assets','currency',{ map:'assets.liquid' }), F('Expecting gift funds?','yesno',{ map:'assets.gift' }) ]),
      ]),
      SEC('Credit & declarations',[
        S('Credit check',[ F('Authorize a soft credit pull?','yesno',{ map:'credit.soft_pull_consent' }) ]),
        S('Declarations',[ F('Any bankruptcies in the last 7 years?','yesno',{ map:'declarations.bankruptcy' }), F('Any outstanding judgments?','yesno',{ map:'declarations.judgments' }) ]),
      ]),
      SEC('Demographics',[
        S('Demographic information',[ F('Ethnicity','multi',{ map:'hmda.ethnicity', required:false, options:opts('Hispanic or Latino','Not Hispanic or Latino','Prefer not to say') }), F('Sex','choice',{ map:'hmda.sex', required:false, options:opts('Female','Male','Prefer not to say') }) ],{description:'Optional. Required by federal law to be asked, never to be answered.'}),
      ]),
      SEC('Review & finish',[
        S('Review your answers',[ F('The information above is accurate','yesno',{ map:'application.attest' }) ],{description:'Confirm and submit your application.'}),
      ]),
    ]
  };
}

/* ============================================================
   State, history, persistence
   ============================================================ */
const LS = 'pylon.builder.v3';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, s=14) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${n}"/></svg>`;
const clone = o => JSON.parse(JSON.stringify(o));

let state = load() || seed();
let sel = { kind:'field', id: state.sections[0].screens[0].fields[0]?.id };
const ui = { mode:'edit', device:'desktop', tab:'form', zoom:1, query:'', dirty:false, testIdx:0, answers:{}, codeFmt:'form', errors:{} };
const prefs = loadPrefs();
const history = { past:[], future:[], limit:100 };

function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); if(!s?.sections) return null; uid = s._uid || 9000; return s; }catch(e){ return null; } }
function persist(){ try{ state._uid = uid; localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(LS+'.prefs')) || {}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem(LS+'.prefs', JSON.stringify(prefs)); }catch(e){} }

function snapshot(){ history.past.push(JSON.stringify(state)); if(history.past.length>history.limit) history.past.shift(); history.future.length=0; syncHistory(); }
function undo(){ if(!history.past.length) return; history.future.push(JSON.stringify(state)); state = JSON.parse(history.past.pop()); restored('Undone'); }
function redo(){ if(!history.future.length) return; history.past.push(JSON.stringify(state)); state = JSON.parse(history.future.pop()); restored('Redone'); }
function restored(msg){ if(!find(sel)) sel = { kind:'screen', id: allScreens()[0]?.id }; markDirty(); renderAll(); syncHistory(); toast(msg); }
function syncHistory(){ $('#dockUndo').disabled = !history.past.length; $('#dockRedo').disabled = !history.future.length; }
function markDirty(){ ui.dirty = true; $('#savePill').classList.add('dirty'); $('#saveText').textContent = 'Unsaved'; }
function markSaved(){ ui.dirty = false; $('#savePill').classList.remove('dirty'); $('#saveText').textContent = 'Saved'; }
function commit(fn, o={}){ snapshot(); fn(); markDirty(); if(!o.quiet) renderAll(); }

/* lookups */
function allScreens(){ return state.sections.flatMap(s => s.screens); }
function allFields(){ return allScreens().flatMap(s => s.fields); }
function find(ref){ if(!ref?.id) return null; for(const sec of state.sections){ if(ref.kind==='section' && sec.id===ref.id) return {section:sec}; for(const scr of sec.screens){ if(ref.kind==='screen' && scr.id===ref.id) return {section:sec, screen:scr}; for(const f of scr.fields){ if(ref.kind==='field' && f.id===ref.id) return {section:sec, screen:scr, field:f}; } } } return null; }
function currentScreen(){ const r = find(sel); if(!r) return null; return r.screen || r.section?.screens[0] || null; }
function parentList(ref){ const r = find(ref); if(ref.kind==='section') return state.sections; if(ref.kind==='screen') return r.section.screens; return r.screen.fields; }
function detach(ref){ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); return list.splice(i,1)[0]; }
function reId(o){ if(Array.isArray(o)) return o.forEach(reId); if(o && typeof o==='object'){ if(o.id) o.id = id(o.id.split('_')[0]); Object.values(o).forEach(reId); } }
function fieldOptions(f){ if(f.optsrc==='states') return US_STATES.map(s=>({id:'st_'+slug(s), label:s, value:slug(s)})); return f.options; }
function mapLabel(m){ const f = allFields().find(x=>x.map===m); return f ? f.label : m; }
function exportForm(){ return { name:state.name, brand:state.brand, style:state.style, styles:state.styles, sections:state.sections.map(s=>({ title:s.title, screens:s.screens.map(x=>({ title:x.title, description:x.description, conditions:x.conditions, fields:x.fields.map(f=>({ label:f.label, type:f.type, required:f.required, description:f.description, map:f.map, validation:f.validation, width:f.width, remember:f.remember, optsrc:f.optsrc, options:f.options.map(o=>({label:o.label,value:o.value})), conditions:f.conditions, appearance:f.appearance, styleRef:f.styleRef })) })) })) }; }
function importForm(j){ if(!Array.isArray(j.sections)) throw new Error('needs a "sections" array'); const next = { name:j.name||state.name, brand:{...state.brand, ...(j.brand||{})}, style:{...state.style, ...(j.style||{})}, styles:j.styles||state.styles||[], sections:j.sections.map(s=>({ id:id('sec'), title:s.title||'Section', open:false, screens:(s.screens||[]).map(x=>({ id:id('s'), title:x.title||'Screen', description:x.description||'', conditions:x.conditions||[], open:false, fields:(x.fields||[]).map(f=>({ id:id('f'), label:f.label||'Question', type:TYPES[f.type]?f.type:'text', required:f.required!==false, description:f.description||'', map:f.map||'', validation:f.validation||'none', width:f.width||'auto', remember:f.remember!==false, optsrc:f.optsrc, options:(f.options||[]).map(o=>({id:id('o'),label:o.label,value:o.value??slug(o.label)})), conditions:f.conditions||[], appearance:f.appearance, styleRef:f.styleRef })) })) })) }; if(!next.sections.length) throw new Error('at least one section is required'); state = next; state.sections[0].open = true; sel = { kind:'screen', id: state.sections[0].screens[0]?.id }; }

/* ============================================================
   Render: tree
   ============================================================ */
const match = t => !ui.query || t.toLowerCase().includes(ui.query.toLowerCase());

   Interactions: selection, tree

const narrow = ()=>innerWidth<=900;
function select(ref, o={}){ sel = ref; if(narrow()){ $('#app').dataset.left='closed'; if(o.inspect) $('#app').dataset.right='open'; else if(!o.keepRight) $('#app').dataset.right='closed'; } if(ui.mode==='test') setMode('edit', {silent:true}); const r = find(ref); if(r?.section && ref.kind!=='section') r.section.open = true; if(r?.screen && ref.kind==='field') r.screen.open = true; ui.tab='form'; ui._noScroll = !!o.noScroll; renderAll(); ui._noScroll=false; if(o.focus) setTimeout(()=>{ const el = $(`#insp [data-bind="${o.focus}"]`); el?.focus(); el?.select?.(); }, 40); }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if(g && !e.target.closest('.ctxmenu')){ select({kind:g.dataset.go, id:g.dataset.id}); } });

const tree = $('#tree');
tree.addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); const node = e.target.closest('.node'); if(!node) return;
  const ref = {kind:node.dataset.kind, id:node.dataset.id};
  if(act?.dataset.act==='toggle'){ e.stopPropagation(); const r = find(ref); const obj = r.screen || r.section; obj.open = node.dataset.open!=='true'; node.dataset.open = obj.open; node.querySelector('.row').setAttribute('aria-expanded', obj.open); persist(); return; }
  if(act?.dataset.act==='menu'){ e.stopPropagation(); openMenu(e, ref); return; }
  if(ui.mode==='edit' && sel.kind===ref.kind && sel.id===ref.id && ref.kind!=='field' && !narrow()){ node.querySelector('[data-act=toggle]').click(); return; }
  select(ref, {noScroll:true});
});
tree.addEventListener('dblclick', e => { const node = e.target.closest('.node'); if(!node) return; select({kind:node.dataset.kind, id:node.dataset.id}, {focus: node.dataset.kind==='field'?'label':'title'}); });
tree.addEventListener('contextmenu', e => { const node = e.target.closest('.node'); if(!node) return; e.preventDefault(); openMenu(e, {kind:node.dataset.kind, id:node.dataset.id}); });
tree.addEventListener('keydown', e => {
  const row = e.target.closest('.row'); if(!row) return; const node = row.parentElement; const ref = {kind:node.dataset.kind, id:node.dataset.id};
  const rows = $$('.row', tree).filter(r => r.offsetParent); const i = rows.indexOf(row); const mod = e.metaKey||e.ctrlKey;
  const k = e.key;
  if(k==='ArrowDown' && !e.altKey){ e.preventDefault(); rows[i+1]?.focus(); }
  else if(k==='ArrowUp' && !e.altKey){ e.preventDefault(); rows[i-1]?.focus(); }
  else if(k==='Enter'){ e.preventDefault(); select(ref, {noScroll:true, focus: ref.kind==='field'?'label':'title'}); }
  else if(k===' '){ e.preventDefault(); select(ref, {noScroll:true}); }
  else if(k==='ArrowRight' && ref.kind!=='field'){ e.preventDefault(); if(node.dataset.open==='false') row.querySelector('.caret').click(); else rows[i+1]?.focus(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); if(ref.kind!=='field' && node.dataset.open==='true') row.querySelector('.caret').click(); else node.parentElement.closest('.node')?.querySelector('.row')?.focus(); }
  else if(k==='Delete' || (k==='Backspace' && mod)){ e.preventDefault(); deleteRef(ref); }
  else if(e.altKey && (k==='ArrowUp'||k==='ArrowDown')){ e.preventDefault(); moveRef(ref, k==='ArrowUp'?-1:1); setTimeout(()=>$(`.node[data-id="${ref.id}"] .row`, tree)?.focus(), 0); }
  else if(mod && k.toLowerCase()==='d'){ e.preventDefault(); duplicateRef(ref); }
  else if(k==='F2'){ e.preventDefault(); select(ref, {focus: ref.kind==='field'?'label':'title'}); }
});

/* drag to reorder (same kind; fields can cross screens, screens cross sections) */
let drag = null;
tree.addEventListener('dragstart', e => { const node = e.target.closest('.node'); if(!node) return; drag = {kind:node.dataset.kind, id:node.dataset.id}; node.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', node.dataset.id); e.stopPropagation(); });
tree.addEventListener('dragend', () => { drag=null; $$('.node', tree).forEach(n=>n.classList.remove('dragging','drop-before','drop-after','drop-into')); });
tree.addEventListener('dragover', e => {
  if(!drag) return; const node = e.target.closest('.node'); if(!node || node.dataset.id===drag.id) return;
  const kind = node.dataset.kind; const into = (drag.kind==='field' && kind==='screen') || (drag.kind==='screen' && kind==='section');
  if(kind!==drag.kind && !into) return; if(node.querySelector(`.node.dragging`)) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  $$('.node', tree).forEach(n=>n.classList.remove('drop-before','drop-after','drop-into'));
  if(into){ node.classList.add('drop-into'); return; }
  const rect = node.querySelector('.row').getBoundingClientRect(); node.classList.add(e.clientY < rect.top + rect.height/2 ? 'drop-before' : 'drop-after');
});
tree.addEventListener('drop', e => {
  if(!drag) return; const node = e.target.closest('.node'); if(!node) return; e.preventDefault();
  const target = {kind:node.dataset.kind, id:node.dataset.id}; const into = node.classList.contains('drop-into'); const before = node.classList.contains('drop-before');
  if(!into && !before && !node.classList.contains('drop-after')) return;
  const moving = drag; commit(()=>{ const item = detach(moving); if(into){ const r = find(target); const list = r.screen ? r.screen.fields : r.section.screens; (r.screen||r.section).open = true; list.push(item); } else { const list = parentList(target); const idx = list.findIndex(x=>x.id===target.id); list.splice(before?idx:idx+1, 0, item); } });
  toast('Moved');
});

function moveRef(ref, dir){ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); const j = i+dir; if(j<0||j>=list.length){ toast(dir<0?'Already first':'Already last'); return; } commit(()=>{ [list[i],list[j]]=[list[j],list[i]]; }); }
function deleteRef(ref){
  const r = find(ref); if(!r) return; const name = r.field?.label || r.screen?.title || r.section?.title; const list = parentList(ref);
  if(ref.kind==='section' && state.sections.length===1) return toast('Keep at least one section','warn');
  commit(()=>{ const i = list.findIndex(x=>x.id===ref.id); list.splice(i,1); if(sel.id===ref.id || !find(sel)){ const next = list[Math.min(i, list.length-1)]; if(next) sel = {kind:ref.kind, id:next.id}; else if(ref.kind==='field') sel = {kind:'screen', id:r.screen.id}; else if(ref.kind==='screen') sel = {kind:'section', id:r.section.id}; else sel = {kind:'section', id:state.sections[0].id}; } });
  toast(`Deleted “${name}”`, 'ok', {label:'Undo', fn:undo});
}
function duplicateRef(ref){ const r = find(ref); if(!r || ref.kind==='section') return toast('Sections can’t be duplicated'); commit(()=>{ const list = parentList(ref); const i = list.findIndex(x=>x.id===ref.id); const copy = clone(list[i]); reId(copy); copy[ref.kind==='field'?'label':'title'] += ' copy'; list.splice(i+1,0,copy); sel = {kind:ref.kind, id:copy.id}; }); toast('Duplicated'); }

/* context menu */
const menu = $('#ctxmenu');
function openMenu(e, ref){
  const r = find(ref); const k = ref.kind; const items = [];
  items.push({l:'Rename', i:'i-text', fn:()=>select(ref,{focus:k==='field'?'label':'title'}), kbd:'F2'});
  if(k!=='section') items.push({l:'Duplicate', i:'i-copy', fn:()=>duplicateRef(ref), kbd:'⌘D'});
  items.push({l:'Move up', i:'i-chev', fn:()=>moveRef(ref,-1), kbd:'⌥↑'}, {l:'Move down', i:'i-chev', fn:()=>moveRef(ref,1), kbd:'⌥↓'});
  if(k==='section') items.push({sep:true},{l:'Add screen', i:'i-plus', fn:()=>addScreen(r.section.id)});
  if(k==='screen') items.push({sep:true},{l:'Add field', i:'i-plus', fn:()=>openTypePicker(r.screen.id)}, {l:'Test from here', i:'i-eye', fn:()=>{ setMode('test'); const idx = testScreens().indexOf(r.screen); ui.testIdx = Math.max(0, idx); renderCanvas({anim:true}); }});
  items.push({sep:true},{l:'Delete', i:'i-trash', fn:()=>deleteRef(ref), danger:true, kbd:'⌫'});
  menu.innerHTML = items.map(it => it.sep ? '<div class="sep"></div>' : `<button role="menuitem" class="${it.danger?'danger':''}">${icon(it.i,14)}${it.l}${it.kbd?`<span class="kbd">${it.kbd}</span>`:''}</button>`).join('');
  const btns = $$('button', menu); items.filter(i=>!i.sep).forEach((it,i)=>{ btns[i].onclick=()=>{ closeMenu(); it.fn(); }; });
  const x = Math.min(e.clientX, innerWidth-216), y = Math.min(e.clientY, innerHeight-btns.length*34-28);
  menu.style.left = x+'px'; menu.style.top = y+'px'; menu.dataset.open='true'; btns[0]?.focus();
}
function closeMenu(){ menu.dataset.open='false'; }
document.addEventListener('pointerdown', e => { if(menu.dataset.open==='true' && !menu.contains(e.target)) closeMenu(); });
menu.addEventListener('keydown', e => { const b = $$('button', menu); const i = b.indexOf(document.activeElement); if(e.key==='ArrowDown'){ e.preventDefault(); b[(i+1)%b.length].focus(); } if(e.key==='ArrowUp'){ e.preventDefault(); b[(i-1+b.length)%b.length].focus(); } if(e.key==='Escape') closeMenu(); });

const screenEl = $('#screen');
screenEl.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if(act){ e.stopPropagation(); const fid = act.closest('.fw')?.dataset.fid; const a = act.dataset.act;
    if(a==='addfield') return openTypePicker(currentScreen()?.id);
    if(a==='addscreen') return addScreen(); if(a==='addsection') return addSection();
    if(a==='del') return deleteRef({kind:'field',id:fid}); if(a==='dup') return duplicateRef({kind:'field',id:fid}); if(a==='up') return moveRef({kind:'field',id:fid},-1);
  }
  if(e.target.id==='restartTest'){ ui.done=false; ui.testIdx=0; ui.answers={}; ui.errors={}; renderCanvas({anim:true}); return; }

  if(e.target.closest('#navNext')){ nextScreen(); return; }
  const ch = e.target.closest('.choice');
  if(ch && ui.mode==='test'){ const fid = ch.dataset.fid, v = ch.dataset.opt; const f = allFields().find(x=>x.id===fid); if(f.type==='multi'){ const cur = new Set(ui.answers[fid]||[]); cur.has(v)?cur.delete(v):cur.add(v); ui.answers[fid]=[...cur]; } else ui.answers[fid]=v; delete ui.errors[fid]; renderCanvas(); return; }
  if(ui.mode!=='edit') return;
  const fw = e.target.closest('.fw'); if(fw){ if(sel.kind==='field' && sel.id===fw.dataset.fid){ if(narrow()) $('#app').dataset.right='open'; return; } select({kind:'field', id:fw.dataset.fid}, {inspect:narrow()}); return; }
  const t = e.target.closest('.scr-title'); if(t && !(sel.kind==='screen' && sel.id===t.dataset.sid)){ sel = {kind:'screen', id:t.dataset.sid}; renderTree(); renderInspector(); $$('.fw.sel', screenEl).forEach(x=>x.classList.remove('sel')); t.classList.add('sel'); }
});
screenEl.addEventListener('input', e => { if(ui.mode!=='test') return; const inp = e.target.closest('[data-fid]'); if(inp){ ui.answers[inp.dataset.fid]=inp.value; if(ui.errors[inp.dataset.fid]){ delete ui.errors[inp.dataset.fid]; inp.closest('.fw')?.classList.remove('err'); inp.closest('.fw')?.querySelector('.ferr')?.remove(); } } });

screenEl.addEventListener('focusout', e => { const t = e.target.closest?.('.scr-title'); if(t && ui.mode==='edit'){ const s = find({kind:'screen',id:t.dataset.sid})?.screen; const v = t.textContent.trim(); if(s && v && v!==s.title){ commit(()=>{ s.title=v; }); } else if(s) t.textContent = s.title; } });

function validate(f, v){ const has = Array.isArray(v) ? v.length>0 : (v!=null && String(v).trim()!==''); if(f.required && !has) return 'This one’s required.'; if(!has) return null; const s = String(v).trim();
  if(f.validation==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return 'Enter a valid email.'; if(f.validation==='phone' && s.replace(/\D/g,'').length<10) return 'Enter a 10-digit phone number.'; if(f.validation==='zip' && !/^\d{5}(-\d{4})?$/.test(s)) return 'Enter a 5-digit ZIP.'; if(f.validation==='positive' && !(parseFloat(s.replace(/[,$]/g,''))>0)) return 'Enter an amount above zero.'; if(f.validation==='adult'){ const d = new Date(s); if(isNaN(d)) return 'Enter a date like 04/12/1990.'; if((Date.now()-d)/31557600000 < 18) return 'Must be 18 or older.'; } return null; }
function nextScreen(){ const screens = testScreens(); const scr = screens[ui.testIdx]; if(!scr) return; ui.errors={}; for(const f of scr.fields.filter(f=>passes(f.conditions))){ const err = validate(f, ui.answers[f.id]); if(err) ui.errors[f.id]=err; }
